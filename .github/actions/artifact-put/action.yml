# Hetzner-only. Callers pass org secrets via with:
#   hetzner_access_key
#   hetzner_secret_access_key
#   hetzner_bucket
name: Upload WebRTC build tarball to Hetzner
description: Stream an uncompressed tar of the host gclient tree and out/ to Hetzner.

inputs:
  path:
    description: Object stem. Uploads artifacts/<repo>/<path>.tar
    required: true
  source:
    description: DEPS_ROOT with gclient checkouts, src/resources, and out/.
    required: true
  hetzner_access_key:
    description: Hetzner object storage access key.
    required: true
  hetzner_secret_access_key:
    description: Hetzner object storage secret access key.
    required: true
  hetzner_bucket:
    description: Hetzner object storage bucket name.
    required: true

runs:
  using: composite
  steps:
    - name: Ensure aws CLI
      shell: bash
      run: |
        set -euo pipefail
        if command -v aws >/dev/null; then
          exit 0
        fi
        if [[ "$(uname -s)" == Darwin ]]; then
          brew install awscli
        else
          sudo apt-get update
          sudo apt-get install -y awscli
        fi

    - name: Stream build tarball to Hetzner
      shell: bash
      env:
        HETZNER_ACCESS_KEY_CI_ARTIFACTS: ${{ inputs.hetzner_access_key }}
        HETZNER_SECRET_ACCESS_KEY_CI_ARTIFACTS: ${{ inputs.hetzner_secret_access_key }}
        HETZNER_BUCKET_CI_ARTIFACTS: ${{ inputs.hetzner_bucket }}
        OBJECT_STEM: ${{ inputs.path }}
        SOURCE: ${{ inputs.source }}
      run: |
        set -euo pipefail
        export AWS_ACCESS_KEY_ID="${HETZNER_ACCESS_KEY_CI_ARTIFACTS:?}"
        export AWS_SECRET_ACCESS_KEY="${HETZNER_SECRET_ACCESS_KEY_CI_ARTIFACTS:?}"
        export AWS_DEFAULT_REGION=hel1
        export AWS_EC2_METADATA_DISABLED=true
        endpoint="--endpoint-url https://hel1.your-objectstorage.com"
        [[ -n "${OBJECT_STEM}" ]]
        [[ -n "${SOURCE}" ]]
        test -d "${SOURCE}"
        test -d "${SOURCE}/src/third_party"
        test -n "$(ls -A "${SOURCE}/src/third_party")"
        test -d "${SOURCE}/out"
        test -n "$(ls -A "${SOURCE}/out")"
        if [[ ! -d "${SOURCE}/src/resources" ]] || \
          [[ -z "$(ls -A "${SOURCE}/src/resources")" ]]; then
          echo "::error::build cache missing src/resources"
          exit 1
        fi
        members=()
        # Host tree + ninja. Do not pack .gclient-git-cache (objects
        # twice) or src/.git / Stream-tracked src files.
        for p in .gclient .gclient_entries \
          .gclient_previous_sync_commits .cipd \
          src/third_party src/build src/buildtools \
          src/testing src/tools src/ios src/resources out; do
          if [[ -e "${SOURCE}/${p}" ]]; then
            members+=("${p}")
          fi
        done
        [[ ${#members[@]} -gt 0 ]]
        BUCKET="${HETZNER_BUCKET_CI_ARTIFACTS:?}"
        object="artifacts/${{ github.repository }}/${OBJECT_STEM}.tar"
        echo "streaming ${SOURCE}/{${members[*]}} -> ${object}"
        # aws s3 cp talks to Hetzner's S3-compatible API, not AWS.
        tar cf - -C "${SOURCE}" "${members[@]}" | \
          aws ${endpoint} s3 cp - "s3://${BUCKET}/${object}"
