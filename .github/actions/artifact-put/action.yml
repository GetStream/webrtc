# Hetzner-only. Callers pass org secrets via with:
#   hetzner_access_key
#   hetzner_secret_access_key
#   hetzner_bucket
name: Upload WebRTC deps tarball to Hetzner
description: Stream a tar of .gclient-git-cache and src/resources to Hetzner. Does not zip.

inputs:
  path:
    description: Object stem. Uploads artifacts/<repo>/<path>.tar
    required: true
  source:
    description: Directory with .gclient-git-cache and src/resources.
    required: true
  hetzner_access_key:
    description: Hetzner object storage access key.
    required: true
  hetzner_secret_access_key:
    description: Hetzner object storage secret access key.
    required: true
  hetzner_bucket:
    description: Hetzner object storage bucket name.
    required: true

runs:
  using: composite
  steps:
    - name: Ensure aws CLI
      shell: bash
      run: |
        set -euo pipefail
        if command -v aws >/dev/null; then
          exit 0
        fi
        if [[ "$(uname -s)" == Darwin ]]; then
          brew install awscli
        else
          sudo apt-get update
          sudo apt-get install -y awscli
        fi

    - name: Stream deps tarball to Hetzner
      shell: bash
      env:
        HETZNER_ACCESS_KEY_CI_ARTIFACTS: ${{ inputs.hetzner_access_key }}
        HETZNER_SECRET_ACCESS_KEY_CI_ARTIFACTS: ${{ inputs.hetzner_secret_access_key }}
        HETZNER_BUCKET_CI_ARTIFACTS: ${{ inputs.hetzner_bucket }}
        OBJECT_STEM: ${{ inputs.path }}
        SOURCE: ${{ inputs.source }}
      run: |
        set -euo pipefail
        export AWS_ACCESS_KEY_ID="${HETZNER_ACCESS_KEY_CI_ARTIFACTS:?}"
        export AWS_SECRET_ACCESS_KEY="${HETZNER_SECRET_ACCESS_KEY_CI_ARTIFACTS:?}"
        export AWS_DEFAULT_REGION=hel1
        export AWS_EC2_METADATA_DISABLED=true
        endpoint="--endpoint-url https://hel1.your-objectstorage.com"
        [[ -n "${OBJECT_STEM}" ]]
        [[ -n "${SOURCE}" ]]
        test -d "${SOURCE}"
        test -d "${SOURCE}/.gclient-git-cache"
        test -n "$(ls -A "${SOURCE}/.gclient-git-cache")"
        if [[ ! -d "${SOURCE}/src/resources" ]] || \
          [[ -z "$(ls -A "${SOURCE}/src/resources")" ]]; then
          echo "::error::deps-key missing src/resources (chromium-webrtc-resources)"
          exit 1
        fi
        BUCKET="${HETZNER_BUCKET_CI_ARTIFACTS:?}"
        object="artifacts/${{ github.repository }}/${OBJECT_STEM}.tar"
        echo "streaming ${SOURCE}/{.gclient-git-cache,src/resources} -> ${object}"
        # aws s3 cp talks to Hetzner's S3-compatible API, not AWS.
        tar cf - -C "${SOURCE}" .gclient-git-cache src/resources | \
          aws ${endpoint} s3 cp - "s3://${BUCKET}/${object}"
