name: Deps Apple
description: Darwin gclient sync for iOS/macOS. Caches deps trees and out/.

inputs:
  webrtc_ref:
    required: true
    description: Branch, tag, or SHA for GetStream/webrtc.
  target_os:
    required: true
    description: Comma-separated gclient target_os (ios and/or mac).
  target_os_cache_key:
    required: true
    description: Cache-safe target_os key suffix.
  config:
    required: true
    description: Cache key config (release or debug).
  ignore_cache:
    required: true
    description: Skip restoring caches and force a fresh sync.

runs:
  using: composite
  steps:
    - name: Setup WebRTC checkout
      uses: ./.github/actions/setup-webrtc
      with:
        webrtc_ref: ${{ inputs.webrtc_ref }}

    - name: Restore Darwin deps and out
      uses: ./.github/actions/cache-webrtc
      with:
        operation: restore
        target_os_cache_key: ${{ inputs.target_os_cache_key }}
        config: ${{ inputs.config }}
        ignore_cache: ${{ inputs.ignore_cache }}

    - name: gclient sync (Apple)
      working-directory: stream_build
      shell: bash
      env:
        DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
        TARGET_OS: ${{ inputs.target_os }}
        JOBS: "8"
        WEBRTC_REPO: https://github.com/GetStream/webrtc.git
      run: make deps

    - name: Save Darwin deps and out
      uses: ./.github/actions/cache-webrtc
      with:
        operation: save
        target_os_cache_key: ${{ inputs.target_os_cache_key }}
        config: ${{ inputs.config }}
        ignore_cache: ${{ inputs.ignore_cache }}
