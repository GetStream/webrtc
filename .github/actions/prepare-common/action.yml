name: Plan platform deps
description: Map selected platforms to gclient target_os.

inputs:
  platform_ios:
    required: true
    description: Whether iOS is selected.
  platform_macos:
    required: true
    description: Whether macOS is selected.
  platform_android:
    required: true
    description: Whether Android is selected.
  platform_windows:
    required: false
    default: "false"
    description: Whether Windows is selected.
  skip_maccatalyst:
    required: false
    default: "false"
    description: Omit Mac Catalyst from the Apple deps label.

outputs:
  run_ios:
    value: ${{ steps.flags.outputs.run_ios }}
  run_macos:
    value: ${{ steps.flags.outputs.run_macos }}
  run_android:
    value: ${{ steps.flags.outputs.run_android }}
  run_windows:
    value: ${{ steps.flags.outputs.run_windows }}
  run_apple:
    value: ${{ steps.flags.outputs.run_apple }}
  apple_target_os:
    value: ${{ steps.flags.outputs.apple_target_os }}
  apple_target_os_label:
    value: ${{ steps.flags.outputs.apple_target_os_label }}
  android_target_os:
    value: ${{ steps.flags.outputs.android_target_os }}
  windows_target_os:
    value: ${{ steps.flags.outputs.windows_target_os }}

runs:
  using: composite
  steps:
    - id: flags
      name: Resolve platform flags
      shell: bash
      run: |
        set -euo pipefail
        ios='${{ inputs.platform_ios }}'
        macos='${{ inputs.platform_macos }}'
        android='${{ inputs.platform_android }}'
        windows='${{ inputs.platform_windows }}'
        skip_maccatalyst='${{ inputs.skip_maccatalyst }}'

        # Display follows the selected platforms. gclient TARGET_OS is the
        # Apple superset so iOS-only and macOS-only share one deps job.
        apple_label_list=()
        if [[ "${ios}" == "true" ]]; then apple_label_list+=("ios"); fi
        if [[ "${macos}" == "true" ]]; then apple_label_list+=("macos"); fi
        if [[ "${ios}" == "true" && "${skip_maccatalyst}" != "true" ]]; then
          apple_label_list+=("maccatalyst")
        fi

        run_apple=false
        apple_target_os=""
        apple_target_os_label=""
        if [[ "${ios}" == "true" || "${macos}" == "true" ]]; then
          run_apple=true
          apple_target_os="ios,mac"
          old_ifs="$IFS"
          IFS=', '
          apple_target_os_label="${apple_label_list[*]}"
          IFS="$old_ifs"
        fi

        android_target_os=""
        if [[ "${android}" == "true" ]]; then
          android_target_os="android,unix"
        fi

        windows_target_os=""
        if [[ "${windows}" == "true" ]]; then
          windows_target_os="win"
        fi

        echo "run_ios=${ios}" >> "${GITHUB_OUTPUT}"
        echo "run_macos=${macos}" >> "${GITHUB_OUTPUT}"
        echo "run_android=${android}" >> "${GITHUB_OUTPUT}"
        echo "run_windows=${windows}" >> "${GITHUB_OUTPUT}"
        echo "run_apple=${run_apple}" >> "${GITHUB_OUTPUT}"
        echo "apple_target_os=${apple_target_os}" >> "${GITHUB_OUTPUT}"
        echo "apple_target_os_label=${apple_target_os_label}" >> "${GITHUB_OUTPUT}"
        echo "android_target_os=${android_target_os}" >> "${GITHUB_OUTPUT}"
        echo "windows_target_os=${windows_target_os}" >> "${GITHUB_OUTPUT}"
