name: Restore WebRTC tree
description: HIT host build cache (or Windows GitHub deps), then make deps.

inputs:
  webrtc_ref:
    required: true
    description: Branch, tag, or SHA already checked out at path src.
  target_os:
    required: true
    description: gclient TARGET_OS (selected tokens only).
  cache_key:
    required: false
    default: ""
    description: Non-empty selects the shared GHCR git cache.
  deps_artifact:
    required: false
    default: ""
    description: GitHub artifact for Windows (deps-windows).
  install_android_packages:
    required: false
    default: "false"
    description: Install apt packages needed for Android builds.

runs:
  using: composite
  steps:
    - name: Setup WebRTC checkout
      uses: ./src/.github/actions/setup-webrtc
      with:
        webrtc_ref: ${{ inputs.webrtc_ref }}
        install_android_packages: ${{ inputs.install_android_packages }}

    # Git cache comes from GHCR. The platform tools package then fills
    # .cipd and src/resources. Android also fills the Debian sysroot
    # under src/build/linux. Hooks stay on and skip files already there.
    # Do not set GIT_CACHE_PATH here: restore-git-cache puts it next
    # to the gclient root, and a step env would point it back inside.
    - name: Restore git cache
      if: ${{ inputs.cache_key != '' }}
      uses: ./src/.github/actions/restore-git-cache

    - id: tools
      name: Select tools package
      if: ${{ inputs.cache_key != '' }}
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.cache_key }}
      run: |
        set -euo pipefail
        case "${CACHE_KEY}" in
          build-ios) platform=ios ;;
          build-macos) platform=macos ;;
          build-android) platform=android ;;
          *) exit 0 ;;
        esac
        echo "platform=${platform}" >> "${GITHUB_OUTPUT}"

    - name: Restore tools
      if: ${{ steps.tools.outputs.platform != '' }}
      uses: ./src/.github/actions/restore-tools
      with:
        platform: ${{ steps.tools.outputs.platform }}

    - name: gclient sync and hooks
      if: ${{ inputs.cache_key != '' }}
      working-directory: src/stream_build
      shell: bash
      env:
        DEPS_ROOT: ${{ github.workspace }}
        WEBRTC_SRC: ${{ github.workspace }}/src
        TARGET_OS: ${{ inputs.target_os }}
        JOBS: "8"
        SHALLOW: "1"
        RUN_HOOKS: "1"
        WEBRTC_REPO: https://github.com/GetStream/webrtc.git
      run: make deps
