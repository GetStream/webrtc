name: Restore WebRTC tree
description: HIT host build cache (or Windows GitHub deps), then make deps.

inputs:
  webrtc_ref:
    required: true
    description: Branch, tag, or SHA already checked out at path src.
  target_os:
    required: true
    description: gclient TARGET_OS (selected tokens only).
  cache_key:
    required: false
    default: ""
    description: Hetzner stem (build-ios, build-macos, build-android).
  skip_cache:
    required: false
    default: "false"
    description: Skip Hetzner download (still make deps; caller uploads).
  deps_artifact:
    required: false
    default: ""
    description: GitHub artifact for Windows (deps-windows).
  install_android_packages:
    required: false
    default: "false"
    description: Install apt packages needed for Android builds.
  hetzner_access_key:
    required: false
    default: ""
    description: Hetzner object storage access key.
  hetzner_secret_access_key:
    required: false
    default: ""
    description: Hetzner object storage secret access key.
  hetzner_bucket:
    required: false
    default: ""
    description: Hetzner object storage bucket name.

runs:
  using: composite
  steps:
    - name: Setup WebRTC checkout
      uses: ./src/.github/actions/setup-webrtc
      with:
        webrtc_ref: ${{ inputs.webrtc_ref }}
        install_android_packages: ${{ inputs.install_android_packages }}

    # Checkout src first (caller). Extract overlays gclient dirs + out/
    # without replacing src/.git. Missing object = cold make deps.
    - name: Download host build cache
      if: ${{ inputs.cache_key != '' && inputs.skip_cache != 'true' }}
      uses: ./src/.github/actions/artifact-download
      with:
        path: ${{ inputs.cache_key }}
        if_missing: skip
        hetzner_access_key: ${{ inputs.hetzner_access_key }}
        hetzner_secret_access_key: ${{ inputs.hetzner_secret_access_key }}
        hetzner_bucket: ${{ inputs.hetzner_bucket }}

    - name: Drop git-cache alternates
      if: ${{ inputs.cache_key != '' }}
      shell: bash
      run: |
        set -euo pipefail
        # Tree is packed without .gclient-git-cache. Nested checkouts
        # may still point alternates at a missing cache path.
        for root in src/third_party src/build src/buildtools \
          src/testing src/tools src/ios; do
          if [[ -d "${GITHUB_WORKSPACE}/${root}" ]]; then
            find "${GITHUB_WORKSPACE}/${root}" \
              \( -path '*/.git/objects/info/alternates' -o \
                 -path '*/.git/objects/info/http-alternates' \) \
              -type f -delete
          fi
        done

    - name: gclient sync and hooks
      if: ${{ inputs.cache_key != '' }}
      working-directory: src/stream_build
      shell: bash
      env:
        DEPS_ROOT: ${{ github.workspace }}
        WEBRTC_SRC: ${{ github.workspace }}/src
        GIT_CACHE_PATH: ${{ github.workspace }}/.gclient-git-cache
        TARGET_OS: ${{ inputs.target_os }}
        JOBS: "8"
        SHALLOW: "1"
        RUN_HOOKS: "1"
        WEBRTC_REPO: https://github.com/GetStream/webrtc.git
      run: make deps

    # Windows is still a git-cache-only GitHub artifact.
    - name: Download same-run deps artifact
      if: ${{ inputs.deps_artifact != '' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.deps_artifact }}
        path: ${{ runner.temp }}/deps-git-cache

    - name: Install same-run gclient object cache
      if: ${{ inputs.deps_artifact != '' }}
      shell: bash
      run: |
        set -euo pipefail
        dest="${GITHUB_WORKSPACE}/.gclient-git-cache"
        src="${RUNNER_TEMP}/deps-git-cache"
        if [[ -d "${src}/.gclient-git-cache" ]]; then
          src="${src}/.gclient-git-cache"
        fi
        rm -rf "${dest}"
        mv "${src}" "${dest}"
        test -n "$(ls -A "${dest}")"
        test -f "${GITHUB_WORKSPACE}/src/DEPS"
        test ! -L "${GITHUB_WORKSPACE}/src"

    - name: gclient sync
      if: ${{ inputs.deps_artifact != '' }}
      working-directory: src/stream_build
      shell: bash
      env:
        DEPS_ROOT: ${{ github.workspace }}
        WEBRTC_SRC: ${{ github.workspace }}/src
        GIT_CACHE_PATH: ${{ github.workspace }}/.gclient-git-cache
        TARGET_OS: ${{ inputs.target_os }}
        JOBS: "8"
        WEBRTC_REPO: https://github.com/GetStream/webrtc.git
      run: make deps
