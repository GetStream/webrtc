name: Restore WebRTC tree
description: Restore the warm OS cache, then gclient sync so SKIP_DEPS=1 can follow.

inputs:
  webrtc_ref:
    required: true
    description: Branch, tag, or SHA for GetStream/webrtc.
  target_os:
    required: true
    description: gclient TARGET_OS (ios,mac / android,unix / win).
  target_os_cache_key:
    required: true
    description: apple, android, or windows.
  install_android_packages:
    required: false
    default: "false"
    description: Install apt packages needed for Android builds.

runs:
  using: composite
  steps:
    - name: Setup WebRTC checkout
      uses: ./.github/actions/setup-webrtc
      with:
        webrtc_ref: ${{ inputs.webrtc_ref }}
        install_android_packages: ${{ inputs.install_android_packages }}

    - name: Restore same-OS deps and out
      uses: ./.github/actions/cache-webrtc
      with:
        operation: restore
        target_os_cache_key: ${{ inputs.target_os_cache_key }}
        ignore_cache: "false"

    - name: gclient sync
      working-directory: stream_build
      shell: bash
      env:
        DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
        TARGET_OS: ${{ inputs.target_os }}
        JOBS: "8"
        WEBRTC_REPO: https://github.com/GetStream/webrtc.git
      run: make deps
