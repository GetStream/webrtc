name: Restore WebRTC tree
description: Restore deps-key or deps-windows from a GitHub artifact.

inputs:
  webrtc_ref:
    required: true
    description: Branch, tag, or SHA already checked out at path src.
  target_os:
    required: true
    description: gclient TARGET_OS (selected tokens only).
  deps_artifact:
    required: true
    description: deps-key or deps-windows (GitHub artifact).
  install_android_packages:
    required: false
    default: "false"
    description: Install apt packages needed for Android builds.

runs:
  using: composite
  steps:
    - name: Setup WebRTC checkout
      uses: ./src/.github/actions/setup-webrtc
      with:
        webrtc_ref: ${{ inputs.webrtc_ref }}
        install_android_packages: ${{ inputs.install_android_packages }}

    # Linux Deps uploaded .gclient-git-cache + src/resources. Unzip to
    # a temp dir (do not overlay onto src/), install both, then shallow
    # gclient sync from that cache. Packed resources make the
    # webrtc-resources hook a sha1 no-op. RUN_HOOKS=1 still fetches
    # host GCS (rust-toolchain on Apple). rewrite_git_cache_alternates
    # runs inside make deps. Do not transplant a Linux working tree.
    - name: Download deps-key
      if: ${{ inputs.deps_artifact == 'deps-key' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.deps_artifact }}
        path: ${{ runner.temp }}/deps-key

    - name: Install deps-key cache and resources
      if: ${{ inputs.deps_artifact == 'deps-key' }}
      shell: bash
      run: |
        set -euo pipefail
        src="${RUNNER_TEMP}/deps-key"
        cache="${src}/.gclient-git-cache"
        resources="${src}/src/resources"
        if [[ ! -d "${cache}" ]]; then
          echo "::error::deps-key missing .gclient-git-cache"
          exit 1
        fi
        if [[ ! -d "${resources}" ]]; then
          echo "::error::deps-key missing src/resources (chromium-webrtc-resources)"
          exit 1
        fi
        dest_cache="${GITHUB_WORKSPACE}/.gclient-git-cache"
        dest_res="${GITHUB_WORKSPACE}/src/resources"
        rm -rf "${dest_cache}" "${dest_res}"
        mv "${cache}" "${dest_cache}"
        mkdir -p "${GITHUB_WORKSPACE}/src"
        mv "${resources}" "${dest_res}"
        test -n "$(ls -A "${dest_cache}")"
        test -n "$(ls -A "${dest_res}")"
        test -f "${GITHUB_WORKSPACE}/src/DEPS"
        test ! -L "${GITHUB_WORKSPACE}/src"

    - name: gclient sync and hooks
      if: ${{ inputs.deps_artifact == 'deps-key' }}
      working-directory: src/stream_build
      shell: bash
      env:
        DEPS_ROOT: ${{ github.workspace }}
        WEBRTC_SRC: ${{ github.workspace }}/src
        GIT_CACHE_PATH: ${{ github.workspace }}/.gclient-git-cache
        TARGET_OS: ${{ inputs.target_os }}
        JOBS: "8"
        SHALLOW: "1"
        RUN_HOOKS: "1"
        WEBRTC_REPO: https://github.com/GetStream/webrtc.git
      run: make deps

    # Windows is still a git-cache-only GitHub artifact.
    - name: Download same-run deps artifact
      if: ${{ inputs.deps_artifact != 'deps-key' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.deps_artifact }}
        path: ${{ runner.temp }}/deps-git-cache

    - name: Install same-run gclient object cache
      if: ${{ inputs.deps_artifact != 'deps-key' }}
      shell: bash
      run: |
        set -euo pipefail
        dest="${GITHUB_WORKSPACE}/.gclient-git-cache"
        src="${RUNNER_TEMP}/deps-git-cache"
        if [[ -d "${src}/.gclient-git-cache" ]]; then
          src="${src}/.gclient-git-cache"
        fi
        rm -rf "${dest}"
        mv "${src}" "${dest}"
        test -n "$(ls -A "${dest}")"
        test -f "${GITHUB_WORKSPACE}/src/DEPS"
        test ! -L "${GITHUB_WORKSPACE}/src"

    - name: gclient sync
      if: ${{ inputs.deps_artifact != 'deps-key' }}
      working-directory: src/stream_build
      shell: bash
      env:
        DEPS_ROOT: ${{ github.workspace }}
        WEBRTC_SRC: ${{ github.workspace }}/src
        GIT_CACHE_PATH: ${{ github.workspace }}/.gclient-git-cache
        TARGET_OS: ${{ inputs.target_os }}
        JOBS: "8"
        WEBRTC_REPO: https://github.com/GetStream/webrtc.git
      run: make deps
