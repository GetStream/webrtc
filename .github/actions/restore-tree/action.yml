name: Restore WebRTC tree
description: Download the same-run git-cache artifact, then gclient sync from local objects so SKIP_DEPS=1 can follow.

inputs:
  webrtc_ref:
    required: true
    description: Branch, tag, or SHA for GetStream/webrtc.
  target_os:
    required: true
    description: gclient TARGET_OS (ios,mac / android,unix / win).
  deps_artifact:
    required: true
    description: Same-run artifact (deps-apple / deps-android / deps-windows).
  install_android_packages:
    required: false
    default: "false"
    description: Install apt packages needed for Android builds.

runs:
  using: composite
  steps:
    - name: Setup WebRTC checkout
      uses: ./.github/actions/setup-webrtc
      with:
        webrtc_ref: ${{ inputs.webrtc_ref }}
        install_android_packages: ${{ inputs.install_android_packages }}

    # Same-run handoff. Do not restore actions/cache here: the warm OS
    # cache is evicted (10 GB quota) even when Deps just saved it.
    # Artifact is git-cache only; the full tree exceeds the per-artifact cap.
    - name: Download same-run deps artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.deps_artifact }}
        path: ${{ runner.temp }}/deps-git-cache

    - name: Install same-run gclient object cache
      shell: bash
      run: |
        set -euo pipefail
        dest="${GITHUB_WORKSPACE}/.gclient_deps/.gclient-git-cache"
        src="${RUNNER_TEMP}/deps-git-cache"
        if [[ -d "${src}/.gclient_deps/.gclient-git-cache" ]]; then
          src="${src}/.gclient_deps/.gclient-git-cache"
        elif [[ -d "${src}/.gclient-git-cache" ]]; then
          src="${src}/.gclient-git-cache"
        fi
        mkdir -p "${GITHUB_WORKSPACE}/.gclient_deps"
        rm -rf "${dest}"
        mv "${src}" "${dest}"
        test -n "$(ls -A "${dest}")"
        ln -sfn .. "${GITHUB_WORKSPACE}/.gclient_deps/src"

    - name: gclient sync
      working-directory: stream_build
      shell: bash
      env:
        DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
        GIT_CACHE_PATH: ${{ github.workspace }}/.gclient_deps/.gclient-git-cache
        TARGET_OS: ${{ inputs.target_os }}
        JOBS: "8"
        WEBRTC_REPO: https://github.com/GetStream/webrtc.git
      run: make deps
