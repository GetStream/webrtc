name: Cache gclient object cache
description: Cross-run actions/cache for gclient objects only. Same-run tree handoff is the deps-* artifact.

inputs:
  operation:
    required: true
    description: restore or save
  target_os_cache_key:
    required: true
    description: apple, android, or windows.
  ignore_cache:
    required: false
    default: "false"
    description: Skip restore (save still runs).

runs:
  using: composite
  steps:
    # Objects-only: .gclient_deps/.gclient-git-cache. gclient sync refills
    # working trees (third_party, build, ios, tools, …). Do not cache those.
    # Keys are immutable warm bases (webrtc-apple|android|windows). Do not
    # add run_id, DEPS hash, config, or github.job.
    - name: Cache key
      shell: bash
      run: |
        echo "Cache key: webrtc-${{ inputs.target_os_cache_key }}"

    - name: Restore gclient object cache
      id: cache-restore
      if: ${{ inputs.operation == 'restore' && inputs.ignore_cache != 'true' }}
      uses: actions/cache/restore@v6
      with:
        path: .gclient_deps/.gclient-git-cache
        key: webrtc-${{ inputs.target_os_cache_key }}

    - name: Prepare DEPS_ROOT after object-cache restore
      if: ${{ inputs.operation == 'restore' }}
      shell: bash
      env:
        CACHE_HIT: ${{ steps.cache-restore.outputs.cache-hit }}
      run: |
        set -euo pipefail
        echo "cache/restore finished cache-hit=${CACHE_HIT:-miss-or-skipped}"
        mkdir -p "${GITHUB_WORKSPACE}/.gclient_deps/.gclient-git-cache"
        ln -sfn .. "${GITHUB_WORKSPACE}/.gclient_deps/src"

    # Keys are immutable. A second save of webrtc-apple|android|windows
    # fails; that is the warm base until eviction.
    # GitHub repo cache quota is 10 GB total. Cap saves at 10 GiB
    # (10737418240 bytes) so we do not spend minutes uploading a blob
    # that will be evicted. Same-run deps-* artifacts still upload.
    - name: Measure git-cache size
      id: measure
      if: ${{ inputs.operation == 'save' }}
      shell: bash
      env:
        CACHE_DIR: ${{ github.workspace }}/.gclient_deps/.gclient-git-cache
      run: |
        set -euo pipefail
        # Conservative vs GitHub's 10 GB (10*1000^3) repo cache quota.
        cap_bytes=$((10 * 1024 * 1024 * 1024))

        if [[ ! -d "${CACHE_DIR}" ]]; then
          echo "git-cache missing: ${CACHE_DIR}"
          exit 0
        fi

        human="unknown"
        if h="$(du -sh "${CACHE_DIR}" 2>/dev/null | awk '{print $1}')"; then
          human="${h:-unknown}"
        fi

        bytes=""
        if out="$(du -sb "${CACHE_DIR}" 2>/dev/null)"; then
          bytes="$(awk '{print $1}' <<<"${out}")"
        fi
        if [[ ! "${bytes}" =~ ^[0-9]+$ ]]; then
          if out="$(du -sk "${CACHE_DIR}" 2>/dev/null)"; then
            kb="$(awk '{print $1}' <<<"${out}")"
            if [[ "${kb}" =~ ^[0-9]+$ ]]; then
              bytes=$((kb * 1024))
            fi
          fi
        fi
        if [[ ! "${bytes}" =~ ^[0-9]+$ ]]; then
          echo "::warning title=Actions cache size::Could not measure ${CACHE_DIR} (du failed). Cache save will still be attempted."
          exit 0
        fi

        gib="$(awk -v b="${bytes}" 'BEGIN { printf "%.2f", b / 1073741824 }')"
        echo "git-cache size: ${human} (${bytes} bytes, ${gib} GiB)"
        echo "cap: 10 GiB = ${cap_bytes} bytes (GitHub quota is 10 GB = 10000000000 bytes; 10 GiB is the conservative save cap)"
        echo "bytes=${bytes}" >> "${GITHUB_OUTPUT}"

        quota_note="Apple and Android caches (webrtc-apple|android; also windows) both count against the same 10 GB repository Actions cache quota."
        if (( bytes > cap_bytes )); then
          echo "skip_save=true" >> "${GITHUB_OUTPUT}"
          echo "::warning title=Actions cache size::git-cache is ${human} (${bytes} bytes, ${gib} GiB), over the 10 GiB cap (${cap_bytes} bytes). Skipping actions/cache save — GitHub would evict it after a multi-minute upload that still prints Cache saved. ${quota_note}"
          echo "::warning title=Deps artifact size::git-cache is ${human} (${bytes} bytes, ${gib} GiB). Same-run artifact upload still proceeds (separate quota from Actions cache)."
          echo "Skipping actions/cache save (over 10 GiB cap)."
        else
          echo "Under cap; actions/cache save will run."
        fi

    - name: Save gclient object cache
      if: ${{ inputs.operation == 'save' && steps.measure.outputs.skip_save != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: .gclient_deps/.gclient-git-cache
        key: webrtc-${{ inputs.target_os_cache_key }}
