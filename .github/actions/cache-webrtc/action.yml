name: Cache WebRTC deps and out
description: Warm gclient/third_party base keyed only by OS family.

inputs:
  operation:
    required: true
    description: restore or save
  target_os_cache_key:
    required: true
    description: apple, android, or windows.
  ignore_cache:
    required: false
    default: "false"
    description: Skip restore (save still runs).

runs:
  using: composite
  steps:
    # GHA caches are immutable: a second save of webrtc-apple|android|windows
    # is a no-op. That is intended (warm base until eviction). Do not add
    # run_id, DEPS hash, config, or github.job.
    - name: Cache key
      shell: bash
      run: echo "Cache key: webrtc-${{ inputs.target_os_cache_key }}"

    - name: Restore deps and out cache
      if: ${{ inputs.operation == 'restore' && inputs.ignore_cache != 'true' }}
      uses: actions/cache/restore@v6
      with:
        path: |
          .gclient_deps
          third_party
          build
          buildtools
          testing
          ios
          tools
        key: webrtc-${{ inputs.target_os_cache_key }}

    - name: Re-link DEPS_ROOT src after cache restore
      if: ${{ inputs.operation == 'restore' }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${GITHUB_WORKSPACE}/.gclient_deps"
        ln -sfn .. "${GITHUB_WORKSPACE}/.gclient_deps/src"

    - name: Save deps and out cache
      if: ${{ inputs.operation == 'save' }}
      uses: actions/cache/save@v6
      with:
        path: |
          .gclient_deps
          third_party
          build
          buildtools
          testing
          ios
          tools
        key: webrtc-${{ inputs.target_os_cache_key }}
