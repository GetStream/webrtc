# WebRTC tests (v2 Makefile DAG). Cold gclient + make test per platform
# (no Hetzner, no git-cache artifact, no needs: Build). Implementation:
# .github/workflows/_test.yml — Test jobs only.

name: Test v2

run-name: >-
  Test v2 config:debug${{ inputs.ios == 'true' && ' iOS' || '' }}${{ inputs.macos == 'true' && (inputs.ios == 'true' && ', macOS' || ' macOS') || '' }}${{ inputs.android == 'true' && format('{0} Android', (inputs.ios == 'true' || inputs.macos == 'true') && ',' || '') || '' }}${{ inputs.windows == 'true' && ((inputs.ios == 'true' || inputs.macos == 'true' || inputs.android == 'true') && ', Windows' || ' Windows') || '' }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      webrtc_ref:
        description: Branch, tag, or SHA for this repo (GetStream/webrtc)
        required: true
        default: main
      ios:
        description: Run iOS simulator tests
        type: boolean
        default: true
      macos:
        description: Run macOS host tests
        type: boolean
        default: true
      android:
        description: Run Android tests
        type: boolean
        default: true
      windows:
        description: Run Windows tests (fails clearly if the runner is not a WebRTC host)
        type: boolean
        default: false

jobs:
  test:
    name: Test v2
    uses: ./.github/workflows/_test.yml
    secrets: inherit
    with:
      webrtc_ref: ${{ inputs.webrtc_ref }}
      ios: ${{ inputs.ios }}
      macos: ${{ inputs.macos }}
      android: ${{ inputs.android }}
      windows: ${{ inputs.windows }}
