# Publish the gclient git cache to GHCR. Run this from the Actions tab,
# or call it from the daily workflow. Pull requests do not run it.
#
# The job token is github.token (contents: read, packages: write).
# No stored secret. A missing ghcr.io/getstream/webrtc-cache:latest
# restores :current once, then starts empty. :latest moves only when
# update_latest is true. An unchanged cache does not push.

name: Update WebRTC Cache

run-name: >-
  Update WebRTC Cache ${{ inputs.tag }}
  update_latest:${{ inputs.update_latest }}

on:
  workflow_dispatch:
    inputs:
      webrtc_ref:
        description: Branch, tag, or SHA whose DEPS to sync.
        type: string
        default: main
      tag:
        description: Registry tag. automatic generates YYYYMMDD-<run_id>.<run_attempt>.
        type: string
        default: automatic
      update_latest:
        description: Move the latest tag to this publish.
        type: boolean
        default: true
      skip_latest_pull:
        description: Skip pulling latest and start from an empty cache.
        type: boolean
        default: false
  workflow_call:
    inputs:
      webrtc_ref:
        description: Branch, tag, or SHA whose DEPS to sync.
        type: string
        default: main
      tag:
        description: Registry tag. automatic generates YYYYMMDD-<run_id>.<run_attempt>.
        type: string
        default: automatic
      update_latest:
        description: Move the latest tag to this publish.
        type: boolean
        default: true
      skip_latest_pull:
        description: Skip pulling latest and start from an empty cache.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: webrtc-cache
  cancel-in-progress: false

env:
  CACHE_IMAGE: ghcr.io/getstream/webrtc-cache

jobs:
  publish:
    name: Publish git cache
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out this workflow
        uses: actions/checkout@v7
        with:
          path: publisher
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Check out WebRTC
        uses: actions/checkout@v7
        with:
          path: src
          ref: ${{ inputs.webrtc_ref }}
          fetch-depth: 1
          fetch-tags: false

      - id: src
        name: Record synced revision
        run: echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: resolved
        name: Resolve tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
          UPDATE_LATEST: ${{ inputs.update_latest && 'true' || 'false' }}
        run: |
          set -euo pipefail
          tag="$(publisher/.github/scripts/webrtc-cache.sh resolve-tag \
            "$TAG_INPUT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "update_latest=${UPDATE_LATEST}" >> "$GITHUB_OUTPUT"
          {
            echo "### WebRTC cache"
            echo
            echo "- image: \`${CACHE_IMAGE}\`"
            echo "- tag: \`${tag}\`"
            echo "- update_latest: ${UPDATE_LATEST}"
            echo "- revision: \`${{ steps.src.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up WebRTC checkout
        uses: ./src/.github/actions/setup-webrtc
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}

      - id: pull
        name: Restore git cache
        uses: ./publisher/.github/actions/restore-git-cache
        with:
          skip: ${{ inputs.skip_latest_pull }}

      - id: before
        name: Fingerprint the pulled cache
        run: echo "fp=$(publisher/.github/scripts/webrtc-cache.sh fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Sync deps into the git cache
        working-directory: src/stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}
          WEBRTC_SRC: ${{ github.workspace }}/src
          TARGET_OS: ios,mac,android,unix
          JOBS: "8"
          SHALLOW: "1"
          RUN_HOOKS: "0"
          WEBRTC_REPO: https://github.com/GetStream/webrtc.git
        run: |
          set -euo pipefail
          df -h "${GITHUB_WORKSPACE}" || true
          make deps

      - name: Drop dep checkouts
        working-directory: src
        run: |
          set -euo pipefail
          git clean -ffdx -q
          df -h "${GITHUB_WORKSPACE}" || true

      - id: after
        name: Fingerprint the synced cache
        run: echo "fp=$(publisher/.github/scripts/webrtc-cache.sh fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Leave latest unchanged
        if: steps.pull.outputs.restored_from == 'latest' && steps.before.outputs.fp == steps.after.outputs.fp
        run: echo "cache unchanged; left ${CACHE_IMAGE}:latest in place"

      - name: Push git cache
        if: steps.pull.outputs.restored_from != 'latest' || steps.before.outputs.fp != steps.after.outputs.fp
        env:
          CACHE_TAG: ${{ steps.resolved.outputs.tag }}
          UPDATE_LATEST: ${{ steps.resolved.outputs.update_latest }}
          GIT_REVISION: ${{ steps.src.outputs.sha }}
          IMAGE_SOURCE: https://github.com/GetStream/webrtc
        run: publisher/.github/scripts/webrtc-cache.sh push
