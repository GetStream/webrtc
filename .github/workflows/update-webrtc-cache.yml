# Publish the gclient git cache to GHCR. Run this from the Actions tab,
# or call it from the daily workflow. Pull requests do not run it.
#
# The job token is github.token (contents: read, packages: write).
# No stored secret. A missing ghcr.io/getstream/webrtc-cache:latest
# restores :current once, then starts empty. :latest moves only when
# update_latest is true. An unchanged cache does not push. The tools
# jobs still run when a tools package is missing, and they pull the
# current git cache. Once those packages exist, an unchanged git cache
# skips them. When the git cache is pushed, iOS, macOS, and Android
# each sync with hooks and publish
# ghcr.io/getstream/webrtc-tools-<platform>. Those packages carry the
# Hetzner tarball members other than the git cache (.cipd and
# src/resources). Android also carries the Debian sysroot under
# src/build/linux.

name: Update WebRTC Cache

run-name: >-
  Update WebRTC Cache ${{ inputs.tag }}
  update_latest:${{ inputs.update_latest }}

on:
  workflow_dispatch:
    inputs:
      webrtc_ref:
        description: Branch, tag, or SHA whose DEPS to sync.
        type: string
        default: main
      tag:
        description: Registry tag. automatic generates YYYYMMDD-<run_id>.<run_attempt>.
        type: string
        default: automatic
      update_latest:
        description: Move the latest tag to this publish.
        type: boolean
        default: true
      skip_latest_pull:
        description: Skip pulling latest and start from an empty cache.
        type: boolean
        default: false
  workflow_call:
    inputs:
      webrtc_ref:
        description: Branch, tag, or SHA whose DEPS to sync.
        type: string
        default: main
      tag:
        description: Registry tag. automatic generates YYYYMMDD-<run_id>.<run_attempt>.
        type: string
        default: automatic
      update_latest:
        description: Move the latest tag to this publish.
        type: boolean
        default: true
      skip_latest_pull:
        description: Skip pulling latest and start from an empty cache.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: webrtc-cache
  cancel-in-progress: false

env:
  CACHE_IMAGE: ghcr.io/getstream/webrtc-cache

jobs:
  publish:
    name: Publish git cache
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      pushed: ${{ steps.gate.outputs.pushed }}
      run_tools: ${{ steps.gate.outputs.run_tools }}
      git_cache_tag: ${{ steps.gate.outputs.git_cache_tag }}
      tag: ${{ steps.resolved.outputs.tag }}
      update_latest: ${{ steps.resolved.outputs.update_latest }}
      revision: ${{ steps.src.outputs.sha }}
    steps:
      - name: Check out this workflow
        uses: actions/checkout@v7
        with:
          path: publisher
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Check out WebRTC
        uses: actions/checkout@v7
        with:
          path: src
          ref: ${{ inputs.webrtc_ref }}
          fetch-depth: 1
          fetch-tags: false

      - id: src
        name: Record synced revision
        run: echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: resolved
        name: Resolve tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
          UPDATE_LATEST: ${{ inputs.update_latest && 'true' || 'false' }}
        run: |
          set -euo pipefail
          tag="$(publisher/.github/scripts/webrtc-cache.sh resolve-tag \
            "$TAG_INPUT" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "update_latest=${UPDATE_LATEST}" >> "$GITHUB_OUTPUT"
          {
            echo "### WebRTC cache"
            echo
            echo "- image: \`${CACHE_IMAGE}\`"
            echo "- tag: \`${tag}\`"
            echo "- update_latest: ${UPDATE_LATEST}"
            echo "- revision: \`${{ steps.src.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up WebRTC checkout
        uses: ./src/.github/actions/setup-webrtc
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}

      - id: pull
        name: Restore git cache
        uses: ./publisher/.github/actions/restore-git-cache
        with:
          skip: ${{ inputs.skip_latest_pull }}

      - id: before
        name: Fingerprint the pulled cache
        run: echo "fp=$(publisher/.github/scripts/webrtc-cache.sh fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Sync deps into the git cache
        working-directory: src/stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}
          WEBRTC_SRC: ${{ github.workspace }}/src
          TARGET_OS: ios,mac,android,unix
          JOBS: "8"
          SHALLOW: "1"
          RUN_HOOKS: "0"
          WEBRTC_REPO: https://github.com/GetStream/webrtc.git
        run: |
          set -euo pipefail
          df -h "${GITHUB_WORKSPACE}" || true
          make deps

      - name: Drop dep checkouts
        working-directory: src
        run: |
          set -euo pipefail
          git clean -ffdx -q
          df -h "${GITHUB_WORKSPACE}" || true

      - id: after
        name: Fingerprint the synced cache
        run: echo "fp=$(publisher/.github/scripts/webrtc-cache.sh fingerprint)" >> "$GITHUB_OUTPUT"

      - id: gate
        name: Record whether the git cache changed
        env:
          RESTORED_FROM: ${{ steps.pull.outputs.restored_from }}
          BEFORE: ${{ steps.before.outputs.fp }}
          AFTER: ${{ steps.after.outputs.fp }}
          RESOLVED_TAG: ${{ steps.resolved.outputs.tag }}
        run: |
          set -euo pipefail
          script="publisher/.github/scripts/webrtc-cache.sh"
          if [[ "${RESTORED_FROM}" == latest && "${BEFORE}" == "${AFTER}" ]]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "git_cache_tag=latest" >> "$GITHUB_OUTPUT"
            echo "cache unchanged; left ${CACHE_IMAGE}:latest in place"
            status="$("$script" tools-status)"
            if [[ "$status" == missing ]]; then
              echo "run_tools=true" >> "$GITHUB_OUTPUT"
              echo "tools package missing; publishing from the current git cache"
            else
              echo "run_tools=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "run_tools=true" >> "$GITHUB_OUTPUT"
            echo "git_cache_tag=${RESOLVED_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Push git cache
        if: steps.gate.outputs.pushed == 'true'
        env:
          CACHE_TAG: ${{ steps.resolved.outputs.tag }}
          UPDATE_LATEST: ${{ steps.resolved.outputs.update_latest }}
          GIT_REVISION: ${{ steps.src.outputs.sha }}
          IMAGE_SOURCE: https://github.com/GetStream/webrtc
        run: publisher/.github/scripts/webrtc-cache.sh push

  tools:
    name: Publish tools (${{ matrix.platform }})
    needs: publish
    if: needs.publish.outputs.run_tools == 'true'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runs_on: macos-26
            target_os: ios
          - platform: macos
            runs_on: macos-26
            target_os: mac
          - platform: android
            runs_on: ubuntu-latest
            target_os: android,unix
    steps:
      - name: Check out this workflow
        uses: actions/checkout@v7
        with:
          path: publisher
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false

      - name: Check out WebRTC
        uses: actions/checkout@v7
        with:
          path: src
          ref: ${{ inputs.webrtc_ref }}
          fetch-depth: 1
          fetch-tags: false

      - name: Set up WebRTC checkout
        uses: ./src/.github/actions/setup-webrtc
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}

      - name: Restore git cache
        uses: ./publisher/.github/actions/restore-git-cache
        with:
          tag: ${{ needs.publish.outputs.git_cache_tag }}

      - name: Sync deps and hooks
        working-directory: src/stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}
          WEBRTC_SRC: ${{ github.workspace }}/src
          TARGET_OS: ${{ matrix.target_os }}
          JOBS: "8"
          SHALLOW: "1"
          RUN_HOOKS: "1"
          WEBRTC_REPO: https://github.com/GetStream/webrtc.git
        run: make deps

      - name: Push tools package
        env:
          PLATFORM: ${{ matrix.platform }}
          CACHE_TAG: ${{ needs.publish.outputs.tag }}
          UPDATE_LATEST: ${{ needs.publish.outputs.update_latest }}
          GIT_REVISION: ${{ needs.publish.outputs.revision }}
          IMAGE_SOURCE: https://github.com/GetStream/webrtc
        run: |
          set -euo pipefail
          script="publisher/.github/scripts/webrtc-cache.sh"
          # restore-git-cache exports the git-cache image. This step
          # publishes the platform tools image instead.
          export CACHE_IMAGE="ghcr.io/getstream/webrtc-tools-${PLATFORM}"
          export ARCHIVE_ROOT="${GITHUB_WORKSPACE}"
          export ARCHIVE_MEMBERS="$("$script" members-for "${PLATFORM}")"
          export ARTIFACT_TYPE="application/vnd.getstream.webrtc.tools.v1"
          export CHUNK_TYPE="application/vnd.getstream.webrtc.tools.chunk.v1"
          echo "tools image: ${CACHE_IMAGE}"
          echo "tools members: ${ARCHIVE_MEMBERS}"
          "$script" push
