# Compare packaged Android and Apple artifacts and print the size table.
# Pull requests compare the two newest GitHub releases. Dispatch can name
# the tags. The same script runs locally and does not compile:
#
#   python3 stream_build/scripts/size-diff.py --before DIR --after DIR
#   python3 stream_build/scripts/size-diff.py --before-tag 145.25.0 --after-tag 156.0.4

name: Size diff

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      before_tag:
        description: Older release tag. Empty uses the release before after_tag.
        required: false
        default: ""
      after_tag:
        description: Newer release tag. Empty uses the latest release.
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  size-diff:
    name: Size diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare packaged artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_TAG: ${{ inputs.before_tag }}
          AFTER_TAG: ${{ inputs.after_tag }}
        run: |
          set -euo pipefail
          args=(--output size-diff.md)
          if [[ -n "${BEFORE_TAG}" ]]; then
            args+=(--before-tag "${BEFORE_TAG}")
          fi
          if [[ -n "${AFTER_TAG}" ]]; then
            args+=(--after-tag "${AFTER_TAG}")
          fi
          python3 stream_build/scripts/size-diff.py "${args[@]}"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- webrtc-size-diff -->';
            const body = fs.readFileSync('size-diff.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find(comment => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
