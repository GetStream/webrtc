name: Publish

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version/tag to create
        required: true
      branch:
        description: Branch, tag, or SHA from GetStream/webrtc to publish
        required: true
        default: main
      alpha:
        description: Mark the GitHub release as an alpha/pre-release
        type: boolean
        default: false
      debug:
        description: Build WebRTC artifacts with GN is_debug=true
        type: boolean
        default: false
      ios:
        description: Build, validate, publish Apple artifacts and trigger stream-video-swift-webrtc
        type: boolean
        default: true
      android:
        description: Build, validate, publish Android artifacts and trigger stream-video-android-webrtc
        type: boolean
        default: true
      changelog:
        description: Optional release notes markdown. Leave empty to use generated notes.
        required: false
        default: ""
      ignore_cache:
        description: Skip restoring dependency caches and force a fresh sync
        type: boolean
        default: false
      desktop_linux:
        description: Build and publish the desktop libwebrtc C++ wrapper for Linux (x64 + arm64)
        type: boolean
        default: false
      desktop_windows:
        description: Build and publish the desktop libwebrtc C++ wrapper for Windows (x64)
        type: boolean
        default: false
      desktop_webos:
        description: Build and publish the desktop libwebrtc C++ wrapper for webOS (armv7, softfp). Requires webos_sysroot.
        type: boolean
        default: false
      webos_sysroot:
        description: >-
          Absolute path to the webOS NDK sysroot on the runner. Required when desktop_webos is enabled;
          provisioning that toolchain onto the runner is not handled by this workflow.
        required: false
        default: ""

jobs:
  # Keep this as a separate first job so invalid manual input fails before any expensive WebRTC sync/build work starts.
  validate_inputs:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - name: Ensure at least one platform is selected
        env:
          BUILD_IOS: ${{ inputs.ios }}
          BUILD_ANDROID: ${{ inputs.android }}
          BUILD_DESKTOP_LINUX: ${{ inputs.desktop_linux }}
          BUILD_DESKTOP_WINDOWS: ${{ inputs.desktop_windows }}
          BUILD_DESKTOP_WEBOS: ${{ inputs.desktop_webos }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_IOS}" != "true" && "${BUILD_ANDROID}" != "true" && \
                "${BUILD_DESKTOP_LINUX}" != "true" && "${BUILD_DESKTOP_WINDOWS}" != "true" && \
                "${BUILD_DESKTOP_WEBOS}" != "true" ]]; then
            echo "At least one of ios, android, desktop_linux, desktop_windows, or desktop_webos must be true."
            exit 1
          fi

      - name: Validate webOS build options
        env:
          BUILD_DESKTOP_WEBOS: ${{ inputs.desktop_webos }}
          WEBOS_SYSROOT: ${{ inputs.webos_sysroot }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_DESKTOP_WEBOS}" == "true" && -z "${WEBOS_SYSROOT}" ]]; then
            echo "::error::webos_sysroot is required when desktop_webos is enabled."
            exit 1
          fi

  plan:
    name: Plan release build
    needs: validate_inputs
    runs-on: ubuntu-latest
    outputs:
      apple_target_os: ${{ steps.plan.outputs.apple_target_os }}
      apple_target_os_cache_key: ${{ steps.plan.outputs.apple_target_os_cache_key }}
      android_target_os: ${{ steps.plan.outputs.android_target_os }}
      android_target_os_cache_key: ${{ steps.plan.outputs.android_target_os_cache_key }}
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@v4

      - id: plan
        name: Plan release build
        uses: ./.github/actions/prepare-common
        with:
          # Platform inputs control which prepare/build/test legs run. iOS releases need both iOS and macOS
          # Apple artifacts, so platform_macos follows the iOS input.
          platform_ios: ${{ inputs.ios }}
          platform_macos: ${{ inputs.ios }}
          platform_android: ${{ inputs.android }}

  prepare_apple:
    name: Prepare Apple dependencies
    needs: plan
    if: ${{ inputs.ios }}
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@v4

      - name: Prepare Apple dependencies
        uses: ./.github/actions/prepare-apple
        with:
          webrtc_ref: ${{ inputs.branch }}
          target_os: ${{ needs.plan.outputs.apple_target_os }}
          target_os_cache_key: ${{ needs.plan.outputs.apple_target_os_cache_key }}
          ignore_cache: ${{ inputs.ignore_cache }}
          release_pipeline_token: ${{ secrets.RELEASE_PIPELINE_TOKEN || github.token }}

  prepare_android:
    name: Prepare Android dependencies
    needs: plan
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@v4

      - name: Prepare Android dependencies
        uses: ./.github/actions/prepare-android
        with:
          webrtc_ref: ${{ inputs.branch }}
          target_os: ${{ needs.plan.outputs.android_target_os }}
          target_os_cache_key: ${{ needs.plan.outputs.android_target_os_cache_key }}
          ignore_cache: ${{ inputs.ignore_cache }}
          release_pipeline_token: ${{ secrets.RELEASE_PIPELINE_TOKEN || github.token }}

  # Shared by build_desktop_linux and build_desktop_webos: both are Linux-hosted
  # and need the same gclient deps ("unix"); only their GN args differ.
  prepare_desktop_linux:
    name: Prepare desktop dependencies (Linux)
    needs: plan
    if: ${{ inputs.desktop_linux || inputs.desktop_webos }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@v4

      - name: Prepare desktop dependencies
        uses: ./.github/actions/prepare-desktop
        with:
          webrtc_ref: ${{ inputs.branch }}
          target_os: unix
          target_os_cache_key: unix
          artifact_name: webrtc-src-prepared-desktop-linux
          ignore_cache: ${{ inputs.ignore_cache }}
          release_pipeline_token: ${{ secrets.RELEASE_PIPELINE_TOKEN || github.token }}

  # NOTE: first Windows-hosted job in this workflow -- unverified against a
  # real runner. Validate before relying on it for a real release.
  prepare_desktop_windows:
    name: Prepare desktop dependencies (Windows)
    needs: plan
    if: ${{ inputs.desktop_windows }}
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@v4

      - name: Prepare desktop dependencies
        uses: ./.github/actions/prepare-desktop
        with:
          webrtc_ref: ${{ inputs.branch }}
          target_os: win
          target_os_cache_key: win
          artifact_name: webrtc-src-prepared-desktop-windows
          ignore_cache: ${{ inputs.ignore_cache }}
          release_pipeline_token: ${{ secrets.RELEASE_PIPELINE_TOKEN || github.token }}

  build_desktop_linux:
    name: Build desktop libwebrtc (Linux ${{ matrix.arch }})
    needs: prepare_desktop_linux
    if: ${{ inputs.desktop_linux }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Check out stream-webrtc-release-pipeline
        uses: actions/checkout@v4
        with:
          repository: GetStream/stream-webrtc-release-pipeline
          path: release-pipeline
          token: ${{ secrets.RELEASE_PIPELINE_TOKEN || github.token }}

      - name: Download prepared desktop WebRTC tree
        uses: actions/download-artifact@v4
        with:
          name: webrtc-src-prepared-desktop-linux

      - name: Extract WebRTC tree
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/webrtc-tree"
          tar -xzf webrtc-src-prepared-desktop-linux.tar.gz -C "${{ github.workspace }}/webrtc-tree"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: release-pipeline
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install depot_tools
        run: |
          if [[ ! -d "${HOME}/depot_tools" ]]; then
            git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${HOME}/depot_tools"
          fi
          echo "PATH=${HOME}/depot_tools:${PATH}" >> "${GITHUB_ENV}"
          echo "DEPOT_TOOLS_UPDATE=0" >> "${GITHUB_ENV}"

      - name: Build desktop libwebrtc artifact
        working-directory: release-pipeline
        run: >-
          bundle exec fastlane desktop build
          "root:${{ github.workspace }}/webrtc-tree/.output/src"
          "products_root:${{ github.workspace }}/desktop-products"
          target_os:linux
          "arch:${{ matrix.arch }}"
          "profile:${{ inputs.debug && 'debug' || 'release' }}"

      - name: Upload desktop libwebrtc artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-linux-${{ matrix.arch }}
          path: desktop-products/libwebrtc-linux-${{ matrix.arch }}-*.zip
          retention-days: 2

  build_desktop_webos:
    name: Build desktop libwebrtc (webOS armv7)
    needs: prepare_desktop_linux
    if: ${{ inputs.desktop_webos }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out stream-webrtc-release-pipeline
        uses: actions/checkout@v4
        with:
          repository: GetStream/stream-webrtc-release-pipeline
          path: release-pipeline
          token: ${{ secrets.RELEASE_PIPELINE_TOKEN || github.token }}

      - name: Download prepared desktop WebRTC tree
        uses: actions/download-artifact@v4
        with:
          name: webrtc-src-prepared-desktop-linux

      - name: Extract WebRTC tree
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/webrtc-tree"
          tar -xzf webrtc-src-prepared-desktop-linux.tar.gz -C "${{ github.workspace }}/webrtc-tree"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: release-pipeline
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install depot_tools
        run: |
          if [[ ! -d "${HOME}/depot_tools" ]]; then
            git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${HOME}/depot_tools"
          fi
          echo "PATH=${HOME}/depot_tools:${PATH}" >> "${GITHUB_ENV}"
          echo "DEPOT_TOOLS_UPDATE=0" >> "${GITHUB_ENV}"

      # This workflow does not provision the webOS NDK/sysroot onto the
      # runner -- webos_sysroot must already point at one that exists there.
      # Fail fast and clearly rather than silently building against the
      # host's own sysroot.
      - name: Verify webOS sysroot is present
        env:
          WEBOS_SYSROOT: ${{ inputs.webos_sysroot }}
        run: |
          set -euo pipefail
          if [[ ! -d "${WEBOS_SYSROOT}" ]]; then
            echo "::error::webos_sysroot '${WEBOS_SYSROOT}' does not exist on this runner. Provisioning the webOS NDK is not handled by this workflow."
            exit 1
          fi

      - name: Build desktop libwebrtc artifact
        working-directory: release-pipeline
        env:
          WEBOS_SYSROOT: ${{ inputs.webos_sysroot }}
        run: >-
          bundle exec fastlane desktop build
          "root:${{ github.workspace }}/webrtc-tree/.output/src"
          "products_root:${{ github.workspace }}/desktop-products"
          target_os:webos
          arch:arm
          "profile:${{ inputs.debug && 'debug' || 'release' }}"
          "extra_gn_args:target_sysroot=${{ inputs.webos_sysroot }}"

      - name: Upload desktop libwebrtc artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-webos-arm
          path: desktop-products/libwebrtc-webos-arm-*.zip
          retention-days: 2

  # NOTE: first Windows-hosted job in this workflow -- unverified against a
  # real runner. Validate before relying on it for a real release.
  build_desktop_windows:
    name: Build desktop libwebrtc (Windows x64)
    needs: prepare_desktop_windows
    if: ${{ inputs.desktop_windows }}
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Check out stream-webrtc-release-pipeline
        uses: actions/checkout@v4
        with:
          repository: GetStream/stream-webrtc-release-pipeline
          path: release-pipeline
          token: ${{ secrets.RELEASE_PIPELINE_TOKEN || github.token }}

      - name: Download prepared desktop WebRTC tree
        uses: actions/download-artifact@v4
        with:
          name: webrtc-src-prepared-desktop-windows

      - name: Extract WebRTC tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/webrtc-tree"
          tar -xzf webrtc-src-prepared-desktop-windows.tar.gz -C "${{ github.workspace }}/webrtc-tree"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: release-pipeline
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install depot_tools
        shell: bash
        run: |
          if [[ ! -d "${HOME}/depot_tools" ]]; then
            git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${HOME}/depot_tools"
          fi
          echo "PATH=${HOME}/depot_tools:${PATH}" >> "${GITHUB_ENV}"
          echo "DEPOT_TOOLS_UPDATE=0" >> "${GITHUB_ENV}"

      - name: Build desktop libwebrtc artifact
        shell: bash
        working-directory: release-pipeline
        run: >-
          bundle exec fastlane desktop build
          "root:${{ github.workspace }}/webrtc-tree/.output/src"
          "products_root:${{ github.workspace }}/desktop-products"
          target_os:win
          arch:x64
          "profile:${{ inputs.debug && 'debug' || 'release' }}"

      - name: Upload desktop libwebrtc artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-windows-x64
          path: desktop-products/libwebrtc-win-x64-*.zip
          retention-days: 2

  validate_ios:
    name: Validate iOS simulator tests
    needs: prepare_apple
    if: ${{ inputs.ios }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out stream-webrtc-release-pipeline
        uses: actions/checkout@v4
        with:
          repository: GetStream/stream-webrtc-release-pipeline
          path: release-pipeline
          token: ${{ secrets.RELEASE_PIPELINE_TOKEN || github.token }}

      - name: Download prepared Apple WebRTC tree
        uses: actions/download-artifact@v4
        with:
          name: webrtc-src-prepared-apple

      - name: Extract WebRTC tree
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/webrtc-tree"
          tar -xzf webrtc-src-prepared-apple.tar.gz -C "${{ github.workspace }}/webrtc-tree"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: release-pipeline
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install depot_tools
        run: |
          if [[ ! -d "${HOME}/depot_tools" ]]; then
            git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${HOME}/depot_tools"
          fi
          echo "PATH=${HOME}/depot_tools:${PATH}" >> "${GITHUB_ENV}"
          echo "DEPOT_TOOLS_UPDATE=0" >> "${GITHUB_ENV}"

      - name: Generate local iOS mb config
        run: |
          python3 - <<'PY'
          import ast
          import pathlib
          import pprint

          base_path = pathlib.Path("${{ github.workspace }}/webrtc-tree/.output/src/tools_webrtc/mb/mb_config.pyl")
          output_path = pathlib.Path("${{ github.workspace }}/release-pipeline/fastlane/mb_configs/local_ios.pyl")
          config = ast.literal_eval(base_path.read_text(encoding="utf-8"))

          mixins = dict(config.get("mixins", {}))
          mixins["stream_local_ios_tests"] = {
              "gn_args": "use_siso=false use_remoteexec=false use_reclient=false",
          }
          config["mixins"] = mixins

          configs = {name: list(value) for name, value in config.get("configs", {}).items()}
          configs["ios_debug_local_bot_arm64"] = configs["ios_debug_bot_arm64"] + ["stream_local_ios_tests"]
          config["configs"] = configs

          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(f"{pprint.pformat(config, width=120)}\n", encoding="utf-8")
          PY

      - name: Run iOS tests
        working-directory: release-pipeline
        run: >-
          bundle exec fastlane ios test
          "root:${{ github.workspace }}/webrtc-tree/.output/src"
          "builder_config:ios_debug_local_bot_arm64"
          "config_file:${{ github.workspace }}/release-pipeline/fastlane/mb_configs/local_ios.pyl"

  validate_macos:
    name: Validate macOS host tests
    needs: prepare_apple
    if: ${{ inputs.ios }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out stream-webrtc-release-pipeline
        uses: actions/checkout@v4
        with:
          repository: GetStream/stream-webrtc-release-pipeline
          path: release-pipeline
          token: ${{ secrets.RELEASE_PIPELINE_TOKEN || github.token }}

      - name: Download prepared Apple WebRTC tree
        uses: actions/download-artifact@v4
        with:
          name: webrtc-src-prepared-apple

      - name: Extract WebRTC tree
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/webrtc-tree"
          tar -xzf webrtc-src-prepared-apple.tar.gz -C "${{ github.workspace }}/webrtc-tree"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: release-pipeline
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install depot_tools
        run: |
          if [[ ! -d "${HOME}/depot_tools" ]]; then
            git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${HOME}/depot_tools"
          fi
          echo "PATH=${HOME}/depot_tools:${PATH}" >> "${GITHUB_ENV}"
          echo "DEPOT_TOOLS_UPDATE=0" >> "${GITHUB_ENV}"

      - name: Run macOS host tests
        working-directory: release-pipeline
        run: >-
          bundle exec fastlane macos test
          "root:${{ github.workspace }}/webrtc-tree/.output/src"

  build_ios:
    name: Build iOS SDK
    needs: prepare_apple
    if: ${{ inputs.ios }}
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Check out stream-webrtc-release-pipeline
        uses: actions/checkout@v4
        with:
          repository: GetStream/stream-webrtc-release-pipeline
          path: release-pipeline
          token: ${{ secrets.RELEASE_PIPELINE_TOKEN || github.token }}

      - name: Download prepared Apple WebRTC tree
        uses: actions/download-artifact@v4
        with:
          name: webrtc-src-prepared-apple

      - name: Extract WebRTC tree
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/webrtc-tree"
          tar -xzf webrtc-src-prepared-apple.tar.gz -C "${{ github.workspace }}/webrtc-tree"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: release-pipeline
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install depot_tools
        run: |
          if [[ ! -d "${HOME}/depot_tools" ]]; then
            git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${HOME}/depot_tools"
          fi
          echo "PATH=${HOME}/depot_tools:${PATH}" >> "${GITHUB_ENV}"
          echo "DEPOT_TOOLS_UPDATE=0" >> "${GITHUB_ENV}"

      - name: Build iOS SDK artifact
        working-directory: release-pipeline
        run: >-
          bundle exec fastlane ios build
          "root:${{ github.workspace }}/webrtc-tree/.output/src"
          "build_root:${{ github.workspace }}/webrtc-tree/.output"
          "products_root:${{ github.workspace }}/ios-products"
          configure_google_client_skip:true
          prepare_signing_skip:false
          sign_product_skip:true
          verify_signatures_skip:true
          zip_product_skip:true
          "build_product_arg_is_debug:${{ inputs.debug }}"
          skip_licenses:true

      - name: Package iOS XCFramework artifact
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ github.workspace }}/ios-products/WebRTC.xcframework" \
            "${{ github.workspace }}/WebRTC-ios.xcframework.zip"

      - name: Upload iOS SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-ios-xcframework
          path: WebRTC-ios.xcframework.zip
          retention-days: 2

  build_macos:
    name: Build macOS SDK
    needs: prepare_apple
    if: ${{ inputs.ios }}
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Check out stream-webrtc-release-pipeline
        uses: actions/checkout@v4
        with:
          repository: GetStream/stream-webrtc-release-pipeline
          path: release-pipeline
          token: ${{ secrets.RELEASE_PIPELINE_TOKEN || github.token }}

      - name: Download prepared Apple WebRTC tree
        uses: actions/download-artifact@v4
        with:
          name: webrtc-src-prepared-apple

      - name: Extract WebRTC tree
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/webrtc-tree"
          tar -xzf webrtc-src-prepared-apple.tar.gz -C "${{ github.workspace }}/webrtc-tree"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: release-pipeline
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install depot_tools
        run: |
          if [[ ! -d "${HOME}/depot_tools" ]]; then
            git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${HOME}/depot_tools"
          fi
          echo "PATH=${HOME}/depot_tools:${PATH}" >> "${GITHUB_ENV}"
          echo "DEPOT_TOOLS_UPDATE=0" >> "${GITHUB_ENV}"

      - name: Build macOS SDK artifact
        working-directory: release-pipeline
        run: >-
          bundle exec fastlane macos build
          "root:${{ github.workspace }}/webrtc-tree/.output/src"
          "products_root:${{ github.workspace }}/macos-products"
          "build_product_arg_is_debug:${{ inputs.debug }}"
          zip_product_skip:true

      - name: Package macOS XCFramework artifact
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ github.workspace }}/macos-products/WebRTC.xcframework" \
            "${{ github.workspace }}/WebRTC-macos.xcframework.zip"

      - name: Upload macOS SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-macos-xcframework
          path: WebRTC-macos.xcframework.zip
          retention-days: 2

  package_apple:
    name: Package Apple release artifact
    needs: [build_ios, build_macos, validate_ios, validate_macos]
    if: ${{ inputs.ios }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Download iOS SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: apple-ios-xcframework
          path: apple-inputs/ios

      - name: Download macOS SDK artifact
        uses: actions/download-artifact@v4
        with:
          name: apple-macos-xcframework
          path: apple-inputs/macos

      - name: Combine Apple XCFrameworks
        env:
          ENABLE_DEBUG: ${{ inputs.debug }}
        run: |
          set -euo pipefail
          ditto -x -k apple-inputs/ios/WebRTC-ios.xcframework.zip apple-inputs/ios
          ditto -x -k apple-inputs/macos/WebRTC-macos.xcframework.zip apple-inputs/macos

          command=(xcodebuild -create-xcframework)
          while IFS= read -r framework; do
            command+=(-framework "${framework}")
            if [[ "${ENABLE_DEBUG}" == "true" ]]; then
              mapfile -t dsyms < <(find "$(dirname "${framework}")" -name "$(basename "${framework}").dSYM" -type d | sort)
              if [[ "${#dsyms[@]}" -eq 0 ]]; then
                echo "::warning::Missing dSYM for ${framework}"
                continue
              fi
              command+=(-debug-symbols "${dsyms[0]}")
            fi
          done < <(find apple-inputs -name '*.framework' -type d | sort)

          "${command[@]}" -output WebRTC.xcframework
          ditto -c -k --sequesterRsrc --keepParent WebRTC.xcframework WebRTC.xcframework.zip

      - name: Upload Apple release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apple
          path: WebRTC.xcframework.zip
          retention-days: 2

  build_android:
    name: Build Android AAR
    needs: prepare_android
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out stream-webrtc-release-pipeline
        uses: actions/checkout@v4
        with:
          repository: GetStream/stream-webrtc-release-pipeline
          path: release-pipeline
          token: ${{ secrets.RELEASE_PIPELINE_TOKEN || github.token }}

      - name: Download prepared Android WebRTC tree
        uses: actions/download-artifact@v4
        with:
          name: webrtc-src-prepared-android

      - name: Extract WebRTC tree
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/webrtc-tree"
          tar -xzf webrtc-src-prepared-android.tar.gz -C "${{ github.workspace }}/webrtc-tree"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip openjdk-8-jdk lsb-release software-properties-common

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          working-directory: release-pipeline
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install depot_tools
        run: |
          if [[ ! -d "${HOME}/depot_tools" ]]; then
            git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "${HOME}/depot_tools"
          fi
          echo "PATH=${HOME}/depot_tools:${PATH}" >> "${GITHUB_ENV}"
          echo "DEPOT_TOOLS_UPDATE=0" >> "${GITHUB_ENV}"

      - name: Build Android SDK artifact
        working-directory: release-pipeline
        run: >-
          bundle exec fastlane android build
          "root:${{ github.workspace }}/webrtc-tree/.output/src"
          "products_root:${{ github.workspace }}/android-products"
          "build_product_arg_is_debug:${{ inputs.debug }}"

      - name: Upload Android SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: android-products/libwebrtc.aar
          retention-days: 2

  publish:
    name: Publish GitHub release
    # GitHub Actions needs are static. Jobs for disabled platforms are skipped quickly, and this condition
    # lets publish continue as long as no selected platform failed or was cancelled.
    needs: [
      validate_ios, validate_macos, package_apple, build_android,
      build_desktop_linux, build_desktop_webos, build_desktop_windows
    ]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ inputs.branch }}
          IS_ALPHA: ${{ inputs.alpha }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          if [[ -n "${CHANGELOG}" ]]; then
            printf '%s\n' "${CHANGELOG}" > "${notes_file}"
          else
            printf 'Automated WebRTC SDK release %s.\n' "${RELEASE_VERSION}" > "${notes_file}"
          fi

          release_args=(
            "${RELEASE_VERSION}"
            release-assets/*
            --repo "${{ github.repository }}"
            --target "${RELEASE_BRANCH}"
            --title "${RELEASE_VERSION}"
            --notes-file "${notes_file}"
          )
          if [[ "${IS_ALPHA}" == "true" ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh release create "${release_args[@]}"

  trigger_downstream_releases:
    name: Trigger downstream WebRTC releases
    needs: publish
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger stream-video-swift-webrtc release
        # Only trigger the Swift wrapper when Apple artifacts were part of this WebRTC release.
        if: ${{ inputs.ios }}
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TRIGGER_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          IS_ALPHA: ${{ inputs.alpha }}
        run: |
          set -euo pipefail
          webrtc_release_url="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_VERSION}"
          gh workflow run publish-from-webrtc.yml \
            --repo GetStream/stream-video-swift-webrtc \
            --field "webrtc_release_url=${webrtc_release_url}" \
            --field "pre_release=${IS_ALPHA}"

      - name: Trigger stream-video-android-webrtc release
        # Only trigger the Android wrapper when Android artifacts were part of this WebRTC release.
        if: ${{ inputs.android }}
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TRIGGER_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          IS_ALPHA: ${{ inputs.alpha }}
        run: |
          set -euo pipefail
          webrtc_release_url="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_VERSION}"
          gh workflow run publish-from-webrtc.yml \
            --repo GetStream/stream-video-android-webrtc \
            --field "webrtc_release_url=${webrtc_release_url}" \
            --field "pre_release=${IS_ALPHA}"
