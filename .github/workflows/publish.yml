# Package WebRTC artifacts. Same path as today's Publish so a PR can dispatch it.
# Does not create a GitHub release.
# _make.yml runs Build then Package combine (products-* in, final-* out).
# Package does not rebuild from git-cache.

name: Package

run-name: >-
  Package config:${{ inputs.config }}${{ inputs.ios == 'true' && ' iOS' || '' }}${{ inputs.macos == 'true' && (inputs.ios == 'true' && ', macOS' || ' macOS') || '' }}${{ inputs.android == 'true' && format('{0} Android{1}', (inputs.ios == 'true' || inputs.macos == 'true') && ',' || '', inputs.android_arch != '' && format(' ({0})', inputs.android_arch) || '') || '' }}${{ inputs.windows == 'true' && ((inputs.ios == 'true' || inputs.macos == 'true' || inputs.android == 'true') && ', Windows' || ' Windows') || '' }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      webrtc_ref:
        description: Branch, tag, or SHA for this repo (GetStream/webrtc)
        required: true
        default: main
      ios:
        description: Package iOS xcframework
        type: boolean
        default: true
      macos:
        description: Package macOS xcframework
        type: boolean
        default: true
      android:
        description: Package Android AAR
        type: boolean
        default: true
      windows:
        description: Package Windows libs (fails clearly if the runner is not a WebRTC host)
        type: boolean
        default: false
      config:
        description: GN configuration
        type: choice
        options:
          - release
          - debug
        default: release
      android_arch:
        description: Optional Android ABI, for example arm64-v8a. Empty = default ABI set.
        required: false
        default: ""

jobs:
  package:
    uses: ./.github/workflows/_make.yml
    secrets: inherit
    with:
      mode: package
      webrtc_ref: ${{ inputs.webrtc_ref }}
      ios: ${{ inputs.ios }}
      macos: ${{ inputs.macos }}
      android: ${{ inputs.android }}
      windows: ${{ inputs.windows }}
      config: ${{ inputs.config }}
      android_arch: ${{ inputs.android_arch }}
