# GitHub release of packaged WebRTC artifacts (v2 Makefile DAG), then
# downstream wrapper publishes. Tests run parallel with Build. Test is
# cold gclient + make test (no Hetzner, no products). Build is the same
# build-v2.yml Package uses. Combine is _package.yml (rename on).
# Four uses: jobs — do not nest Package v2 → Build v2 → _build.yml from
# this file beyond build-v2.yml itself. Publish waits on Test + Package.

name: Release v2

run-name: >-
  Release v2 config:${{ inputs.config }}${{ inputs.prerelease == 'true' && ' Pre-Release' || '' }} ${{ inputs.version }}${{ inputs.ios == 'true' && ' iOS' || '' }}${{ inputs.macos == 'true' && (inputs.ios == 'true' && ', macOS' || ' macOS') || '' }}${{ inputs.android == 'true' && format('{0} Android{1}', (inputs.ios == 'true' || inputs.macos == 'true') && ',' || '', inputs.android_arch != '' && format(' ({0})', inputs.android_arch) || '') || '' }}${{ inputs.windows == 'true' && ((inputs.ios == 'true' || inputs.macos == 'true' || inputs.android == 'true') && ', Windows' || ' Windows') || '' }}

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version/tag to create
        required: true
      prerelease:
        description: Mark the GitHub release as a pre-release
        type: boolean
        default: false
      release_notes:
        description: Optional release notes markdown. Empty uses a one-line fallback.
        required: false
        default: ""
      webrtc_ref:
        description: Branch, tag, or SHA for this repo (GetStream/webrtc)
        required: true
        default: main
      ios:
        description: Include iOS xcframework
        type: boolean
        default: true
      macos:
        description: Include macOS xcframework
        type: boolean
        default: true
      android:
        description: Include Android AAR
        type: boolean
        default: true
      windows:
        description: Include Windows libs (fails clearly if the runner is not a WebRTC host)
        type: boolean
        default: false
      config:
        description: GN configuration
        type: choice
        options:
          - release
          - debug
        default: release
      android_arch:
        description: Optional Android ABI, for example arm64-v8a. Empty = default ABI set.
        required: false
        default: ""

jobs:
  test:
    name: Test v2
    uses: ./.github/workflows/_test.yml
    secrets: inherit
    with:
      webrtc_ref: ${{ inputs.webrtc_ref }}
      ios: ${{ inputs.ios }}
      macos: ${{ inputs.macos }}
      android: ${{ inputs.android }}
      windows: ${{ inputs.windows }}

  build:
    name: Build v2
    uses: ./.github/workflows/build-v2.yml
    secrets: inherit
    with:
      webrtc_ref: ${{ inputs.webrtc_ref }}
      ios: ${{ inputs.ios }}
      macos: ${{ inputs.macos }}
      android: ${{ inputs.android }}
      windows: ${{ inputs.windows }}
      config: ${{ inputs.config }}
      android_arch: ${{ inputs.android_arch }}

  package:
    name: Package
    needs: [build]
    uses: ./.github/workflows/_package.yml
    with:
      ios: ${{ inputs.ios }}
      macos: ${{ inputs.macos }}
      android: ${{ inputs.android }}
      windows: ${{ inputs.windows }}
      rename: true

  release:
    name: Release
    needs: [test, package]
    uses: ./.github/workflows/_release.yml
    secrets: inherit
    with:
      webrtc_ref: ${{ inputs.webrtc_ref }}
      version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
      release_notes: ${{ inputs.release_notes }}
      ios: ${{ inputs.ios }}
      macos: ${{ inputs.macos }}
      android: ${{ inputs.android }}
