# Manual WebRTC build. Dispatchable from a PR because this path exists on the
# default branch. Implementation: .github/workflows/_make.yml

name: Build

run-name: >-
  Build config:${{ inputs.config }}${{ inputs.ios == 'true' && ' iOS' || '' }}${{ inputs.macos == 'true' && (inputs.ios == 'true' && ', macOS' || ' macOS') || '' }}${{ inputs.android == 'true' && format('{0} Android{1}', (inputs.ios == 'true' || inputs.macos == 'true') && ',' || '', inputs.android_arch != '' && format(' ({0})', inputs.android_arch) || '') || '' }}${{ inputs.windows == 'true' && ((inputs.ios == 'true' || inputs.macos == 'true' || inputs.android == 'true') && ', Windows' || ' Windows') || '' }}

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      webrtc_ref:
        description: Branch, tag, or SHA for this repo (GetStream/webrtc)
        required: true
        default: main
      ios:
        description: Build iOS
        type: boolean
        default: true
      macos:
        description: Build macOS
        type: boolean
        default: true
      android:
        description: Build Android
        type: boolean
        default: true
      windows:
        description: Build Windows (fails clearly if the runner is not a WebRTC host)
        type: boolean
        default: false
      config:
        description: GN configuration
        type: choice
        options:
          - release
          - debug
        default: release
      android_arch:
        description: Optional Android ABI, for example arm64-v8a. Empty = default ABI set.
        required: false
        default: ""
      ignore_cache:
        description: Skip restoring dependency caches and force a fresh sync
        type: boolean
        default: false

jobs:
  build:
    uses: ./.github/workflows/_make.yml
    secrets: inherit
    with:
      mode: build
      webrtc_ref: ${{ inputs.webrtc_ref }}
      ios: ${{ inputs.ios }}
      macos: ${{ inputs.macos }}
      android: ${{ inputs.android }}
      windows: ${{ inputs.windows }}
      config: ${{ inputs.config }}
      ignore_cache: ${{ inputs.ignore_cache }}
      android_arch: ${{ inputs.android_arch }}
