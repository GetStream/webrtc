# Called by Test v2 and Release v2. workflow_call only.
# Cold gclient + make test. No Hetzner, no products, no Build/Package/Release.

name: WebRTC test v2

on:
  workflow_call:
    inputs:
      webrtc_ref:
        required: true
        type: string
      ios:
        required: true
        type: boolean
      macos:
        required: true
        type: boolean
      android:
        required: true
        type: boolean
      windows:
        required: true
        type: boolean

env:
  DEPS_ROOT: ${{ github.workspace }}
  WEBRTC_SRC: ${{ github.workspace }}/src
  GIT_CACHE_PATH: ${{ github.workspace }}/.gclient-git-cache

jobs:
  validate_inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Ensure at least one platform is selected
        env:
          BUILD_IOS: ${{ inputs.ios }}
          BUILD_MACOS: ${{ inputs.macos }}
          BUILD_ANDROID: ${{ inputs.android }}
          BUILD_WINDOWS: ${{ inputs.windows }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_IOS}" != "true" && "${BUILD_MACOS}" != "true" &&
                "${BUILD_ANDROID}" != "true" && "${BUILD_WINDOWS}" != "true" ]]; then
            echo "Select at least one platform."
            exit 1
          fi

  plan:
    name: Plan
    needs: validate_inputs
    runs-on: ubuntu-latest
    outputs:
      android_target_os: ${{ steps.plan.outputs.android_target_os }}
      windows_target_os: ${{ steps.plan.outputs.windows_target_os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - id: plan
        name: Plan target_os
        uses: ./src/.github/actions/prepare-common-v2
        with:
          platform_ios: ${{ inputs.ios }}
          platform_macos: ${{ inputs.macos }}
          platform_android: ${{ inputs.android }}
          platform_windows: ${{ inputs.windows }}

  test_ios:
    name: Test iOS
    needs: [plan]
    if: ${{ inputs.ios }}
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
          ref: ${{ inputs.webrtc_ref }}
      - name: Setup WebRTC checkout
        uses: ./src/.github/actions/setup-webrtc
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
      - name: Test iOS
        working-directory: src/stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}
          WEBRTC_SRC: ${{ github.workspace }}/src
          GIT_CACHE_PATH: ${{ github.workspace }}/.gclient-git-cache
          TARGET_OS: ios
          JOBS: "8"
          WEBRTC_REPO: https://github.com/GetStream/webrtc.git
        run: make test ios

  test_macos:
    name: Test macOS
    needs: [plan]
    if: ${{ inputs.macos }}
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
          ref: ${{ inputs.webrtc_ref }}
      - name: Setup WebRTC checkout
        uses: ./src/.github/actions/setup-webrtc
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
      - name: Test macOS
        working-directory: src/stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}
          WEBRTC_SRC: ${{ github.workspace }}/src
          GIT_CACHE_PATH: ${{ github.workspace }}/.gclient-git-cache
          TARGET_OS: mac
          JOBS: "8"
          WEBRTC_REPO: https://github.com/GetStream/webrtc.git
        run: make test macos

  test_android:
    name: Test Android
    needs: [plan]
    if: ${{ inputs.android }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
          ref: ${{ inputs.webrtc_ref }}
      - name: Setup WebRTC checkout
        uses: ./src/.github/actions/setup-webrtc
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
          install_android_packages: "true"
      - name: Test Android
        working-directory: src/stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}
          WEBRTC_SRC: ${{ github.workspace }}/src
          GIT_CACHE_PATH: ${{ github.workspace }}/.gclient-git-cache
          TARGET_OS: ${{ needs.plan.outputs.android_target_os }}
          JOBS: "8"
          WEBRTC_REPO: https://github.com/GetStream/webrtc.git
        run: make test android

  test_windows:
    name: Test Windows
    needs: [plan]
    if: ${{ inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
          ref: ${{ inputs.webrtc_ref }}
      - name: Check Windows WebRTC host
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v make >/dev/null || missing+=("GNU make")
          command -v python3 >/dev/null || missing+=("python3")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Windows WebRTC host is not ready on windows-latest (missing: ${missing[*]}). This job is wired for make test windows, but the runner image cannot run it yet."
            exit 1
          fi
      - name: Setup WebRTC checkout
        uses: ./src/.github/actions/setup-webrtc
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
      - name: Test Windows
        working-directory: src/stream_build
        shell: bash
        env:
          DEPS_ROOT: ${{ github.workspace }}
          WEBRTC_SRC: ${{ github.workspace }}/src
          GIT_CACHE_PATH: ${{ github.workspace }}/.gclient-git-cache
          TARGET_OS: ${{ needs.plan.outputs.windows_target_os }}
          JOBS: "8"
          WEBRTC_REPO: https://github.com/GetStream/webrtc.git
        run: make test windows
