# Called by Build / Test / Package / Release dispatch workflows.
# Not listed in the Actions dispatch UI (workflow_call only).
# Callers pass mode: build | test | package | release.

name: WebRTC make

on:
  workflow_call:
    inputs:
      mode:
        description: build, test, package, or release
        required: true
        type: string
      webrtc_ref:
        required: true
        type: string
      ios:
        required: true
        type: boolean
      macos:
        required: true
        type: boolean
      android:
        required: true
        type: boolean
      windows:
        required: true
        type: boolean
      config:
        required: true
        type: string
      ignore_cache:
        required: true
        type: boolean
      android_arch:
        required: false
        type: string
        default: ""
      version:
        required: false
        type: string
        default: ""
      prerelease:
        required: false
        type: boolean
        default: false
      release_notes:
        required: false
        type: string
        default: ""

jobs:
  validate_inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - name: Ensure at least one platform is selected
        env:
          BUILD_IOS: ${{ inputs.ios }}
          BUILD_MACOS: ${{ inputs.macos }}
          BUILD_ANDROID: ${{ inputs.android }}
          BUILD_WINDOWS: ${{ inputs.windows }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "${MODE}" in
            build|test|package|release) ;;
            *)
              echo "mode must be build, test, package, or release (got '${MODE}')."
              exit 1
              ;;
          esac
          if [[ "${BUILD_IOS}" != "true" && "${BUILD_MACOS}" != "true" &&
                "${BUILD_ANDROID}" != "true" && "${BUILD_WINDOWS}" != "true" ]]; then
            echo "Select at least one platform."
            exit 1
          fi
          if [[ "${MODE}" == "test" && "${BUILD_ANDROID}" == "true" ]]; then
            echo "make test android is not wired. Disable Android on Test."
            exit 1
          fi
          if [[ "${MODE}" == "release" && -z "${{ inputs.version }}" ]]; then
            echo "Release requires a version."
            exit 1
          fi

      - name: Validate Android build options
        if: ${{ inputs.android }}
        env:
          ANDROID_ARCH: ${{ inputs.android_arch }}
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_ARCH}" && "${ANDROID_ARCH}" =~ [[:space:]] ]]; then
            echo "::error::android_arch accepts a single ABI, for example arm64-v8a."
            exit 1
          fi

  plan:
    name: Plan
    needs: validate_inputs
    runs-on: ubuntu-latest
    outputs:
      config: ${{ inputs.config }}
      mode: ${{ inputs.mode }}
      run_ios: ${{ steps.plan.outputs.run_ios }}
      run_macos: ${{ steps.plan.outputs.run_macos }}
      run_android: ${{ steps.plan.outputs.run_android }}
      run_windows: ${{ steps.plan.outputs.run_windows }}
      run_apple: ${{ steps.plan.outputs.run_apple }}
      apple_target_os: ${{ steps.plan.outputs.apple_target_os }}
      apple_target_os_cache_key: ${{ steps.plan.outputs.apple_target_os_cache_key }}
      apple_target_os_label: ${{ steps.plan.outputs.apple_target_os_label }}
      android_target_os: ${{ steps.plan.outputs.android_target_os }}
      android_target_os_cache_key: ${{ steps.plan.outputs.android_target_os_cache_key }}
      deps_apple_name: ${{ steps.names.outputs.deps_apple_name }}
      deps_android_name: ${{ steps.names.outputs.deps_android_name }}
      build_ios_name: ${{ steps.names.outputs.build_ios_name }}
      build_macos_name: ${{ steps.names.outputs.build_macos_name }}
      build_android_name: ${{ steps.names.outputs.build_android_name }}
      build_windows_name: ${{ steps.names.outputs.build_windows_name }}
      test_ios_name: ${{ steps.names.outputs.test_ios_name }}
      test_macos_name: ${{ steps.names.outputs.test_macos_name }}
      test_windows_name: ${{ steps.names.outputs.test_windows_name }}
      tests_passed_name: ${{ steps.names.outputs.tests_passed_name }}
      package_ios_name: ${{ steps.names.outputs.package_ios_name }}
      package_macos_name: ${{ steps.names.outputs.package_macos_name }}
      package_android_name: ${{ steps.names.outputs.package_android_name }}
      package_windows_name: ${{ steps.names.outputs.package_windows_name }}
      finalise_package_name: ${{ steps.names.outputs.finalise_package_name }}
      github_release_name: ${{ steps.names.outputs.github_release_name }}
      trigger_downstream_name: ${{ steps.names.outputs.trigger_downstream_name }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        name: Plan target_os
        uses: ./.github/actions/prepare-common
        with:
          platform_ios: ${{ inputs.ios }}
          platform_macos: ${{ inputs.macos }}
          platform_android: ${{ inputs.android }}
          platform_windows: ${{ inputs.windows }}
      - id: names
        name: Plan job display names
        env:
          MODE: ${{ inputs.mode }}
          CONFIG: ${{ inputs.config }}
          VERSION: ${{ inputs.version }}
          RUN_IOS: ${{ steps.plan.outputs.run_ios }}
          RUN_MACOS: ${{ steps.plan.outputs.run_macos }}
          RUN_ANDROID: ${{ steps.plan.outputs.run_android }}
          RUN_WINDOWS: ${{ steps.plan.outputs.run_windows }}
          RUN_APPLE: ${{ steps.plan.outputs.run_apple }}
          APPLE_LABEL: ${{ steps.plan.outputs.apple_target_os_label }}
        run: |
          set -euo pipefail
          # Job `name:` does not evaluate nested ==/&&/||. Emit plain strings.

          active_or_skipped() {
            local prefix="$1"
            local is_active="$2"
            local detail="${3:-}"
            if [[ "${is_active}" == "true" ]]; then
              if [[ -n "${detail}" ]]; then
                printf '%s (%s)\n' "${prefix}" "${detail}"
              else
                printf '%s\n' "${prefix}"
              fi
            else
              printf '%s (skipped)\n' "${prefix}"
            fi
          }

          apple_label="${APPLE_LABEL//, /,}"
          apple_label="${apple_label//,/, }"

          is_build=false
          is_test=false
          is_package=false
          is_release=false
          [[ "${MODE}" == "build" ]] && is_build=true
          [[ "${MODE}" == "test" || "${MODE}" == "release" ]] && is_test=true
          [[ "${MODE}" == "package" || "${MODE}" == "release" ]] && is_package=true
          [[ "${MODE}" == "release" ]] && is_release=true

          run_build_ios=false
          run_build_macos=false
          run_build_android=false
          run_build_windows=false
          run_test_ios=false
          run_test_macos=false
          run_test_windows=false
          run_package_ios=false
          run_package_macos=false
          run_package_android=false
          run_package_windows=false
          [[ "${is_build}" == "true" && "${RUN_IOS}" == "true" ]] && run_build_ios=true
          [[ "${is_build}" == "true" && "${RUN_MACOS}" == "true" ]] && run_build_macos=true
          [[ "${is_build}" == "true" && "${RUN_ANDROID}" == "true" ]] && run_build_android=true
          [[ "${is_build}" == "true" && "${RUN_WINDOWS}" == "true" ]] && run_build_windows=true
          [[ "${is_test}" == "true" && "${RUN_IOS}" == "true" ]] && run_test_ios=true
          [[ "${is_test}" == "true" && "${RUN_MACOS}" == "true" ]] && run_test_macos=true
          [[ "${is_test}" == "true" && "${RUN_WINDOWS}" == "true" ]] && run_test_windows=true
          [[ "${is_package}" == "true" && "${RUN_IOS}" == "true" ]] && run_package_ios=true
          [[ "${is_package}" == "true" && "${RUN_MACOS}" == "true" ]] && run_package_macos=true
          [[ "${is_package}" == "true" && "${RUN_ANDROID}" == "true" ]] && run_package_android=true
          [[ "${is_package}" == "true" && "${RUN_WINDOWS}" == "true" ]] && run_package_windows=true

          {
            echo "deps_apple_name=$(active_or_skipped "Deps Apple" "${RUN_APPLE}" "${apple_label}")"
            echo "deps_android_name=$(active_or_skipped "Deps Android" "${RUN_ANDROID}")"
            echo "build_ios_name=$(active_or_skipped "Build iOS" "${run_build_ios}" "${CONFIG}")"
            echo "build_macos_name=$(active_or_skipped "Build macOS" "${run_build_macos}" "${CONFIG}")"
            echo "build_android_name=$(active_or_skipped "Build Android" "${run_build_android}" "${CONFIG}")"
            echo "build_windows_name=$(active_or_skipped "Build Windows" "${run_build_windows}" "${CONFIG}")"
            echo "test_ios_name=$(active_or_skipped "Test iOS" "${run_test_ios}" "${CONFIG}")"
            echo "test_macos_name=$(active_or_skipped "Test macOS" "${run_test_macos}" "${CONFIG}")"
            echo "test_windows_name=$(active_or_skipped "Test Windows" "${run_test_windows}" "${CONFIG}")"
            echo "tests_passed_name=$(active_or_skipped "Tests passed" "${is_package}")"
            echo "package_ios_name=$(active_or_skipped "Package iOS" "${run_package_ios}" "${CONFIG}")"
            echo "package_macos_name=$(active_or_skipped "Package macOS" "${run_package_macos}" "${CONFIG}")"
            echo "package_android_name=$(active_or_skipped "Package Android" "${run_package_android}" "${CONFIG}")"
            echo "package_windows_name=$(active_or_skipped "Package Windows" "${run_package_windows}" "${CONFIG}")"
            echo "finalise_package_name=$(active_or_skipped "Finalise package" "${is_package}")"
            release_title="Release (skipped)"
            [[ "${is_release}" == "true" ]] && release_title="Release ${VERSION}"
            echo "github_release_name=${release_title}"
            echo "trigger_downstream_name=$(active_or_skipped "Trigger downstream WebRTC releases" "${is_release}")"
          } >> "${GITHUB_OUTPUT}"

  deps_apple:
    name: ${{ needs.plan.outputs.deps_apple_name }}
    needs: plan
    if: ${{ inputs.ios || inputs.macos }}
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Deps Apple
        uses: ./.github/actions/deps-apple
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
          target_os: ${{ needs.plan.outputs.apple_target_os }}
          target_os_cache_key: ${{ needs.plan.outputs.apple_target_os_cache_key }}
          config: ${{ inputs.config }}
          ignore_cache: ${{ inputs.ignore_cache }}

  deps_android:
    name: ${{ needs.plan.outputs.deps_android_name }}
    needs: plan
    if: ${{ inputs.android }}
    runs-on: ${{ vars.WEBRTC_ANDROID_RUNNER != '' && vars.WEBRTC_ANDROID_RUNNER || 'runner-extra-capacity' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Deps Android
        uses: ./.github/actions/deps-android
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
          target_os: ${{ needs.plan.outputs.android_target_os }}
          target_os_cache_key: ${{ needs.plan.outputs.android_target_os_cache_key }}
          config: ${{ inputs.config }}
          ignore_cache: ${{ inputs.ignore_cache }}

  build_ios:
    name: ${{ needs.plan.outputs.build_ios_name }}
    needs: [plan, deps_apple]
    if: ${{ inputs.mode == 'build' && inputs.ios }}
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/restore-tree
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
          target_os_cache_key: ${{ needs.plan.outputs.apple_target_os_cache_key }}
          config: ${{ inputs.config }}
      - name: Build iOS
        working-directory: stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
        run: make build ios
      - uses: ./.github/actions/cache-webrtc
        continue-on-error: true
        with:
          operation: save
          target_os_cache_key: ${{ needs.plan.outputs.apple_target_os_cache_key }}
          config: ${{ inputs.config }}

  build_macos:
    name: ${{ needs.plan.outputs.build_macos_name }}
    needs: [plan, deps_apple]
    if: ${{ inputs.mode == 'build' && inputs.macos }}
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/restore-tree
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
          target_os_cache_key: ${{ needs.plan.outputs.apple_target_os_cache_key }}
          config: ${{ inputs.config }}
      - name: Build macOS
        working-directory: stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
        run: make build macos
      - uses: ./.github/actions/cache-webrtc
        continue-on-error: true
        with:
          operation: save
          target_os_cache_key: ${{ needs.plan.outputs.apple_target_os_cache_key }}
          config: ${{ inputs.config }}

  build_android:
    name: ${{ needs.plan.outputs.build_android_name }}
    needs: [plan, deps_android]
    if: ${{ inputs.mode == 'build' && inputs.android }}
    runs-on: ${{ vars.WEBRTC_ANDROID_RUNNER != '' && vars.WEBRTC_ANDROID_RUNNER || 'runner-extra-capacity' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/restore-tree
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
          target_os_cache_key: ${{ needs.plan.outputs.android_target_os_cache_key }}
          config: ${{ inputs.config }}
          install_android_packages: "true"
      - name: Build Android
        working-directory: stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
          ANDROID_ARCH: ${{ inputs.android_arch }}
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "${ANDROID_ARCH}" ]]; then
            extra+=(ARCHS="${ANDROID_ARCH}")
          fi
          make build android "${extra[@]}"
      - uses: ./.github/actions/cache-webrtc
        continue-on-error: true
        with:
          operation: save
          target_os_cache_key: ${{ needs.plan.outputs.android_target_os_cache_key }}
          config: ${{ inputs.config }}

  test_ios:
    name: ${{ needs.plan.outputs.test_ios_name }}
    needs: [plan, deps_apple]
    if: ${{ (inputs.mode == 'test' || inputs.mode == 'release') && inputs.ios }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/restore-tree
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
          target_os_cache_key: ${{ needs.plan.outputs.apple_target_os_cache_key }}
          config: ${{ inputs.config }}
      - name: Build iOS
        working-directory: stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
        run: make build ios
      - name: Test iOS
        working-directory: stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          SKIP_DEPS: "1"
        run: make test ios
      - uses: ./.github/actions/cache-webrtc
        continue-on-error: true
        with:
          operation: save
          target_os_cache_key: ${{ needs.plan.outputs.apple_target_os_cache_key }}
          config: ${{ inputs.config }}

  test_macos:
    name: ${{ needs.plan.outputs.test_macos_name }}
    needs: [plan, deps_apple]
    if: ${{ (inputs.mode == 'test' || inputs.mode == 'release') && inputs.macos }}
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/restore-tree
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
          target_os_cache_key: ${{ needs.plan.outputs.apple_target_os_cache_key }}
          config: ${{ inputs.config }}
      - name: Build macOS
        working-directory: stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
        run: make build macos
      - name: Test macOS
        working-directory: stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          SKIP_DEPS: "1"
        run: make test macos
      - uses: ./.github/actions/cache-webrtc
        continue-on-error: true
        with:
          operation: save
          target_os_cache_key: ${{ needs.plan.outputs.apple_target_os_cache_key }}
          config: ${{ inputs.config }}

  test_windows:
    name: ${{ needs.plan.outputs.test_windows_name }}
    needs: plan
    if: ${{ (inputs.mode == 'test' || inputs.mode == 'release') && inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Check Windows WebRTC host
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v make >/dev/null || missing+=("GNU make")
          command -v python3 >/dev/null || missing+=("python3")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Windows WebRTC host is not ready on windows-latest (missing: ${missing[*]}). This job is wired for make test windows, but the runner image cannot run it yet."
            exit 1
          fi
      - uses: ./.github/actions/restore-tree
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
          target_os_cache_key: win
          config: ${{ inputs.config }}
      - name: Windows deps
        working-directory: stream_build
        shell: bash
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          TARGET_OS: win
          JOBS: "8"
          WEBRTC_REPO: https://github.com/GetStream/webrtc.git
        run: make deps
      - name: Build Windows
        working-directory: stream_build
        shell: bash
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
        run: make build windows
      - name: Test Windows
        working-directory: stream_build
        shell: bash
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          SKIP_DEPS: "1"
        run: make test windows

  tests_passed:
    name: ${{ needs.plan.outputs.tests_passed_name }}
    needs: [plan, test_ios, test_macos, test_windows]
    if: ${{ always() && !cancelled() && (inputs.mode == 'package' || inputs.mode == 'release') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require tests before package on Release
        env:
          MODE: ${{ inputs.mode }}
          WANT_IOS: ${{ inputs.ios }}
          WANT_MACOS: ${{ inputs.macos }}
          WANT_WINDOWS: ${{ inputs.windows }}
          IOS_RESULT: ${{ needs.test_ios.result }}
          MACOS_RESULT: ${{ needs.test_macos.result }}
          WINDOWS_RESULT: ${{ needs.test_windows.result }}
        run: |
          set -euo pipefail
          if [[ "${MODE}" != "release" ]]; then
            echo "Package mode: tests are not required."
            exit 0
          fi
          failed=0
          if [[ "${WANT_IOS}" == "true" && "${IOS_RESULT}" != "success" ]]; then
            echo "::error::Release is blocked: iOS tests ${IOS_RESULT}."
            failed=1
          fi
          if [[ "${WANT_MACOS}" == "true" && "${MACOS_RESULT}" != "success" ]]; then
            echo "::error::Release is blocked: macOS tests ${MACOS_RESULT}."
            failed=1
          fi
          if [[ "${WANT_WINDOWS}" == "true" && "${WINDOWS_RESULT}" != "success" ]]; then
            echo "::error::Release is blocked: Windows tests ${WINDOWS_RESULT}."
            failed=1
          fi
          if [[ "${failed}" -ne 0 ]]; then
            echo "If tests fail, do not package or publish."
            exit 1
          fi
          echo "Selected-platform tests passed (Android tests are unwired and skipped)."

  package_ios:
    name: ${{ needs.plan.outputs.package_ios_name }}
    needs: [plan, deps_apple, tests_passed]
    if: ${{ (inputs.mode == 'package' || inputs.mode == 'release') && inputs.ios && !cancelled() && needs.tests_passed.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/restore-tree
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
          target_os_cache_key: ${{ needs.plan.outputs.apple_target_os_cache_key }}
          config: ${{ inputs.config }}
      - name: Build iOS
        working-directory: stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          PRODUCTS: ${{ github.workspace }}/products
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
        run: make build ios
      - name: Package iOS
        working-directory: stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          PRODUCTS: ${{ github.workspace }}/products
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
        run: make package ios
      - uses: ./.github/actions/cache-webrtc
        continue-on-error: true
        with:
          operation: save
          target_os_cache_key: ${{ needs.plan.outputs.apple_target_os_cache_key }}
          config: ${{ inputs.config }}
      - name: Upload products-ios
        uses: actions/upload-artifact@v7
        with:
          name: products-ios
          path: products/ios
          if-no-files-found: error
          retention-days: 7

  package_macos:
    name: ${{ needs.plan.outputs.package_macos_name }}
    needs: [plan, deps_apple, tests_passed]
    if: ${{ (inputs.mode == 'package' || inputs.mode == 'release') && inputs.macos && !cancelled() && needs.tests_passed.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/restore-tree
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
          target_os_cache_key: ${{ needs.plan.outputs.apple_target_os_cache_key }}
          config: ${{ inputs.config }}
      - name: Build macOS
        working-directory: stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          PRODUCTS: ${{ github.workspace }}/products
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
        run: make build macos
      - name: Package macOS
        working-directory: stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          PRODUCTS: ${{ github.workspace }}/products
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
        run: make package macos
      - uses: ./.github/actions/cache-webrtc
        continue-on-error: true
        with:
          operation: save
          target_os_cache_key: ${{ needs.plan.outputs.apple_target_os_cache_key }}
          config: ${{ inputs.config }}
      - name: Upload products-macos
        uses: actions/upload-artifact@v7
        with:
          name: products-macos
          path: products/macos
          if-no-files-found: error
          retention-days: 7

  package_android:
    name: ${{ needs.plan.outputs.package_android_name }}
    needs: [plan, deps_android, tests_passed]
    if: ${{ (inputs.mode == 'package' || inputs.mode == 'release') && inputs.android && !cancelled() && needs.tests_passed.result == 'success' }}
    runs-on: ${{ vars.WEBRTC_ANDROID_RUNNER != '' && vars.WEBRTC_ANDROID_RUNNER || 'runner-extra-capacity' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/restore-tree
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
          target_os_cache_key: ${{ needs.plan.outputs.android_target_os_cache_key }}
          config: ${{ inputs.config }}
          install_android_packages: "true"
      - name: Build Android
        working-directory: stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          PRODUCTS: ${{ github.workspace }}/products
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
          ANDROID_ARCH: ${{ inputs.android_arch }}
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "${ANDROID_ARCH}" ]]; then
            extra+=(ARCHS="${ANDROID_ARCH}")
          fi
          make build android "${extra[@]}"
      - name: Package Android
        working-directory: stream_build
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          PRODUCTS: ${{ github.workspace }}/products
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
          ANDROID_ARCH: ${{ inputs.android_arch }}
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "${ANDROID_ARCH}" ]]; then
            extra+=(ARCHS="${ANDROID_ARCH}")
          fi
          make package android "${extra[@]}"
      - uses: ./.github/actions/cache-webrtc
        continue-on-error: true
        with:
          operation: save
          target_os_cache_key: ${{ needs.plan.outputs.android_target_os_cache_key }}
          config: ${{ inputs.config }}
      - name: Upload products-android
        uses: actions/upload-artifact@v7
        with:
          name: products-android
          path: products
          if-no-files-found: error
          retention-days: 7

  build_windows:
    name: ${{ needs.plan.outputs.build_windows_name }}
    needs: plan
    if: ${{ inputs.mode == 'build' && inputs.windows }}
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Check Windows WebRTC host
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v make >/dev/null || missing+=("GNU make")
          command -v python3 >/dev/null || missing+=("python3")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Windows WebRTC host is not ready on windows-latest (missing: ${missing[*]}). This job is wired for make build windows, but the runner image cannot run it yet."
            exit 1
          fi
      - uses: ./.github/actions/restore-tree
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
          target_os_cache_key: win
          config: ${{ inputs.config }}
      - name: Windows deps
        working-directory: stream_build
        shell: bash
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          TARGET_OS: win
          JOBS: "8"
          WEBRTC_REPO: https://github.com/GetStream/webrtc.git
        run: make deps
      - name: Build Windows
        working-directory: stream_build
        shell: bash
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
        run: make build windows

  package_windows:
    name: ${{ needs.plan.outputs.package_windows_name }}
    needs: [plan, tests_passed]
    if: ${{ (inputs.mode == 'package' || inputs.mode == 'release') && inputs.windows && !cancelled() && needs.tests_passed.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - name: Check Windows WebRTC host
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v make >/dev/null || missing+=("GNU make")
          command -v python3 >/dev/null || missing+=("python3")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Windows WebRTC host is not ready on windows-latest (missing: ${missing[*]}). This job is wired for make package windows, but the runner image cannot run it yet."
            exit 1
          fi
      - uses: ./.github/actions/restore-tree
        with:
          webrtc_ref: ${{ inputs.webrtc_ref }}
          target_os_cache_key: win
          config: ${{ inputs.config }}
      - name: Windows deps
        working-directory: stream_build
        shell: bash
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          TARGET_OS: win
          JOBS: "8"
          WEBRTC_REPO: https://github.com/GetStream/webrtc.git
        run: make deps
      - name: Build Windows
        working-directory: stream_build
        shell: bash
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          PRODUCTS: ${{ github.workspace }}/products
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
        run: make build windows
      - name: Package Windows
        working-directory: stream_build
        shell: bash
        env:
          DEPS_ROOT: ${{ github.workspace }}/.gclient_deps
          PRODUCTS: ${{ github.workspace }}/products
          CONFIG: ${{ inputs.config }}
          SKIP_DEPS: "1"
        run: make package windows
      - name: Upload products-windows
        uses: actions/upload-artifact@v7
        with:
          name: products-windows
          path: products/windows
          if-no-files-found: error
          retention-days: 7

  finalise_package:
    name: ${{ needs.plan.outputs.finalise_package_name }}
    needs: [plan, tests_passed, package_ios, package_macos, package_android, package_windows]
    if: ${{ (inputs.mode == 'package' || inputs.mode == 'release') && !cancelled() && needs.tests_passed.result == 'success' && !failure() }}
    runs-on: ${{ (inputs.ios || inputs.macos) && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Download product artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: products-*
          path: combine-in

      - name: Combine Apple xcframeworks
        if: ${{ inputs.ios || inputs.macos }}
        working-directory: stream_build
        env:
          PRODUCTS: ${{ github.workspace }}/combine-in
          SKIP_LICENSES: "1"
        run: make combine

      - name: Attach LICENSE.md and zip Apple artifact
        if: ${{ inputs.ios || inputs.macos }}
        run: |
          set -euo pipefail
          dest="${GITHUB_WORKSPACE}/combine-in/WebRTC.xcframework"
          test -d "${dest}"
          if [[ ! -f "${dest}/LICENSE.md" ]]; then
            license="$(find "${GITHUB_WORKSPACE}/combine-in" -path '*/WebRTC.xcframework/LICENSE.md' ! -path "${dest}/LICENSE.md" | head -n 1 || true)"
            if [[ -n "${license}" ]]; then
              cp "${license}" "${dest}/LICENSE.md"
            fi
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "${dest}" \
            "${GITHUB_WORKSPACE}/WebRTC.xcframework.zip"

      - name: Pass through Android AAR
        if: ${{ inputs.android }}
        run: |
          set -euo pipefail
          src="$(find "${GITHUB_WORKSPACE}/combine-in" -name libwebrtc.aar -type f | head -n 1)"
          test -n "${src}"
          cp "${src}" "${GITHUB_WORKSPACE}/libwebrtc.aar"
          mkdir -p "${GITHUB_WORKSPACE}/final-android"
          cp "${src}" "${GITHUB_WORKSPACE}/final-android/libwebrtc.aar"
          license="$(find "${GITHUB_WORKSPACE}/combine-in" -name LICENSE.md -type f | head -n 1 || true)"
          if [[ -n "${license}" ]]; then
            cp "${license}" "${GITHUB_WORKSPACE}/final-android/LICENSE.md"
          fi

      - name: Pass through Windows products
        if: ${{ inputs.windows }}
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/windows-libs"
          cp -R "${GITHUB_WORKSPACE}/combine-in/products-windows/." "${GITHUB_WORKSPACE}/windows-libs/"

      - name: Rename copies for wrapper SDKs
        if: ${{ inputs.mode == 'release' }}
        working-directory: stream_build
        env:
          PRODUCTS: ${{ github.workspace }}/combine-in
        run: |
          set -euo pipefail
          if [[ "${{ inputs.ios }}" == "true" || "${{ inputs.macos }}" == "true" ]]; then
            make rename apple XCFRAMEWORK="${PRODUCTS}/WebRTC.xcframework"
            ditto -c -k --sequesterRsrc --keepParent \
              "${PRODUCTS}/renamed/StreamWebRTC.xcframework" \
              "${GITHUB_WORKSPACE}/StreamWebRTC.xcframework.zip"
          fi
          if [[ "${{ inputs.android }}" == "true" ]]; then
            make rename android AAR="${GITHUB_WORKSPACE}/libwebrtc.aar"
            cp "${PRODUCTS}/renamed/libwebrtc.aar" \
              "${GITHUB_WORKSPACE}/libwebrtc-renamed.aar"
          fi

      - name: Upload WebRTC.xcframework.zip
        if: ${{ inputs.ios || inputs.macos }}
        uses: actions/upload-artifact@v7
        with:
          name: final-apple
          path: WebRTC.xcframework.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload libwebrtc.aar
        if: ${{ inputs.android }}
        uses: actions/upload-artifact@v7
        with:
          name: final-android
          path: final-android
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows libs
        if: ${{ inputs.windows }}
        uses: actions/upload-artifact@v7
        with:
          name: final-windows
          path: windows-libs
          if-no-files-found: error
          retention-days: 7

      - name: Upload StreamWebRTC.xcframework.zip
        if: ${{ inputs.mode == 'release' && (inputs.ios || inputs.macos) }}
        uses: actions/upload-artifact@v7
        with:
          name: final-apple-renamed
          path: StreamWebRTC.xcframework.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload renamed Android AAR
        if: ${{ inputs.mode == 'release' && inputs.android }}
        uses: actions/upload-artifact@v7
        with:
          name: final-android-renamed
          path: libwebrtc-renamed.aar
          if-no-files-found: error
          retention-days: 7

  github_release:
    name: ${{ needs.plan.outputs.github_release_name }}
    needs: [plan, finalise_package]
    if: ${{ inputs.mode == 'release' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.webrtc_ref }}

      - name: Download finalised artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: final-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ inputs.webrtc_ref }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::No finalised artifacts to attach."
            exit 1
          fi
          notes_file="$(mktemp)"
          if [[ -n "${RELEASE_NOTES}" ]]; then
            printf '%s\n' "${RELEASE_NOTES}" > "${notes_file}"
          else
            printf 'Automated WebRTC SDK release %s.\n' "${RELEASE_VERSION}" > "${notes_file}"
          fi
          release_args=(
            "${RELEASE_VERSION}"
            "${assets[@]}"
            --repo "${{ github.repository }}"
            --target "${RELEASE_REF}"
            --title "${RELEASE_VERSION}"
            --notes-file "${notes_file}"
          )
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh release create "${release_args[@]}"

  trigger_downstream_releases:
    name: ${{ needs.plan.outputs.trigger_downstream_name }}
    needs: [plan, github_release]
    if: ${{ inputs.mode == 'release' && !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger stream-video-swift-webrtc release
        if: ${{ inputs.ios || inputs.macos }}
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TRIGGER_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          webrtc_release_url="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_VERSION}"
          gh workflow run publish-from-webrtc.yml \
            --repo GetStream/stream-video-swift-webrtc \
            --field "webrtc_release_url=${webrtc_release_url}" \
            --field "pre_release=${IS_PRERELEASE}"

      - name: Trigger stream-video-android-webrtc release
        if: ${{ inputs.android }}
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TRIGGER_RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          webrtc_release_url="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_VERSION}"
          gh workflow run publish-from-webrtc.yml \
            --repo GetStream/stream-video-android-webrtc \
            --field "webrtc_release_url=${webrtc_release_url}" \
            --field "pre_release=${IS_PRERELEASE}"
